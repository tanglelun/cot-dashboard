<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare - Net Data</title>
<link rel="stylesheet" href="nav_market.css">
<style>
:root{
  --bg:#fff;--ink:#111;--muted:#7a7d86;--line:#e5e7eb;--soft:#f5f6f8;
  --panel:#fff;--accent:#7cff00;--blue:#1277ff;--teal:#00b8a9;--red:#ff4d4d;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);font-weight:700}
.nav{height:68px;background:#000;border-bottom:1px solid #141923;display:flex;align-items:center;gap:28px;padding:0 28px;color:#fff}
.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-size:28px;font-weight:900;letter-spacing:-.5px}
.logo{width:26px;height:42px;border-radius:14px;background:#fff;transform:rotate(35deg)}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-link{color:#f2f2f2;text-decoration:none;font-size:16px;font-weight:900}
.nav-link.active{color:var(--accent)}
.nav-search-icon{margin-left:auto;width:44px;height:44px;border:1px solid #20283a;border-radius:999px;background:#080a12;display:flex;align-items:center;justify-content:center;color:#aeb4c0;text-decoration:none}
.nav-search-icon:before{content:"";width:16px;height:16px;border:3px solid currentColor;border-radius:50%;display:block}
.nav-search-icon:after{content:"";width:9px;height:3px;background:currentColor;border-radius:999px;transform:translate(-2px,10px) rotate(45deg);display:block;position:absolute}
.nav-toggle,.nav-check{display:none}
.wrap{width:100%;padding:22px clamp(14px,2vw,30px) 30px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
.eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
h1{margin:0;font-size:clamp(28px,4vw,52px);line-height:.95;letter-spacing:-1.2px}
.sub{color:var(--muted);font-size:14px;margin-top:10px;font-weight:800}
.compare-tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:14px 0 0}
.compare-tab{height:34px;border:0;border-radius:6px;background:transparent;color:var(--muted);padding:0 14px;font:900 13px Inter,Arial,sans-serif;cursor:pointer}
.compare-tab.active{background:#000;color:#fff}
.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-bottom:14px}
.series-card{border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:8px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.dot{width:10px;height:10px;border-radius:50%}
.dot.a{background:var(--blue)}.dot.b{background:var(--teal)}
.field-grid{display:grid;grid-template-columns:minmax(170px,0.22fr) 1fr;gap:8px}
.field-grid.single{grid-template-columns:1fr}
.hidden{display:none!important}
label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
select{
  width:100%;height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
  padding:0 34px 0 10px;font:800 14px Inter,Arial,sans-serif;outline:none;
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#111 50%),linear-gradient(135deg,#111 50%,transparent 50%);
  background-position:calc(100% - 17px) 16px,calc(100% - 11px) 16px;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;
  text-overflow:ellipsis;
}
select:focus{border-color:#9ca3af}
.toolbar{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:38px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:0 13px;font:900 13px Inter,Arial,sans-serif;cursor:pointer}
.btn.active{background:#000;color:#fff;border-color:#000}
.btn.mode.active{background:var(--accent);color:#000;border-color:var(--accent)}
.chart-shell{border:1px solid var(--line);background:#fff;min-height:560px;position:relative}
.chart-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.02)}
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.legend-item{display:flex;align-items:center;gap:7px}
.latest{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:var(--muted);font-size:12px}
.latest strong{display:block;color:var(--ink);font-size:18px;line-height:1.1;margin-top:3px}
.canvas-wrap{position:relative;height:520px}
canvas{width:100%;height:100%;display:block}
.tip{position:absolute;z-index:4;pointer-events:none;background:#111;color:#fff;border-radius:6px;padding:9px 10px;font-size:12px;line-height:1.45;box-shadow:0 10px 28px rgba(0,0,0,.22);display:none;min-width:190px}
.tip b{color:#fff}.tip-row{display:flex;justify-content:space-between;gap:16px;color:#d9dce3}.tip-row span:first-child{color:#aeb4c0}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:24px}
@media(max-width:820px){
  .nav{height:auto;min-height:96px;flex-wrap:wrap;padding:22px 18px}
  .brand{font-size:34px}.logo{width:28px;height:48px}
  .nav-toggle{display:flex;margin-left:auto;width:58px;height:58px;border:1px solid #20283a;border-radius:50%;align-items:center;justify-content:center}
  .nav-toggle span,.nav-toggle:before,.nav-toggle:after{content:"";display:block;width:28px;height:3px;background:#fff;border-radius:999px;position:absolute}
  .nav-toggle:before{transform:translateY(-9px)}.nav-toggle:after{transform:translateY(9px)}
  .nav-links{display:none;order:3;flex-direction:column;align-items:stretch;width:100%;gap:4px;padding-top:10px}
  .nav-check:checked ~ .nav-links{display:flex}
  .nav-link{padding:12px 4px;font-size:18px}
  .nav-search-icon{display:none}
  .wrap{padding:18px 12px 24px}
  .hero{align-items:flex-start;flex-direction:column}
  .controls{grid-template-columns:1fr}
  .field-grid{grid-template-columns:1fr}
  select{font-size:16px}
  .toolbar{justify-content:flex-start}
  .chart-top{align-items:flex-start;flex-direction:column}
  .latest{width:100%;grid-template-columns:1fr}
  .canvas-wrap{height:470px}
}
</style>
</head>

<main class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">Indicators</div>

<script src="economic_data_embed.js"></script>
<script>
const state = { data:null, indexData:null, indexHistory:{}, type:'indicators', period:'all', indexed:false, hover:null, drawToken:0 };
const els = {
  countryA: document.getElementById('countryA'), indicatorA: document.getElementById('indicatorA'),
  countryB: document.getElementById('countryB'), indicatorB: document.getElementById('indicatorB'),
  indexA: document.getElementById('indexA'), indexB: document.getElementById('indexB'),
  chart: document.getElementById('chart'), tip: document.getElementById('tip'), empty: document.getElementById('empty'),
  legend: document.getElementById('legend'), latest: document.getElementById('latest'), meta: document.getElementById('dataMeta'),
  modeBtn: document.getElementById('modeBtn')
};
const ctx = els.chart.getContext('2d');
const colors = { a:'#1277ff', b:'#00b8a9', blue:'#1277ff', teal:'#00b8a9', grid:'#e5e7eb', text:'#7a7d86', ink:'#111' };
const INDEX_INDICATOR_PREFIX = 'index:';

function parseX(label){
  const text = String(label || '');
  const q = text.match(/^(\d{4})-Q([1-4])$/);
  if(q) return Number(q[1]) * 12 + (Number(q[2]) - 1) * 3;
  const d = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(d) return Number(d[1]) * 12 + Number(d[2]) - 1 + (Number(d[3]) - 1) / 31;
  const m = text.match(/^(\d{4})-(\d{1,2})/);
  if(m) return Number(m[1]) * 12 + Number(m[2]) - 1;
  const y = text.match(/^(\d{4})$/);
  if(y) return Number(y[1]) * 12;
  return Number.NaN;
}
function formatNumber(value, decimals=2, unit=''){
  if(!Number.isFinite(value)) return '--';
  const fixed = Math.abs(value) >= 100 ? 1 : decimals;
  return value.toLocaleString('en-US', { maximumFractionDigits: fixed, minimumFractionDigits: fixed }) + (unit ? ` ${unit}` : '');
}
function getIndicator(key){ return state.data.indicators.find(item => item.key === key) || state.data.indicators[0]; }
function getCountry(code){ return state.data.countries.find(item => item.code === code) || state.data.countries[0]; }
function isIndexIndicator(key){ return String(key || '').startsWith(INDEX_INDICATOR_PREFIX); }
function indexIndicatorSymbol(key){ return String(key || '').slice(INDEX_INDICATOR_PREFIX.length); }
function eligibleIndicators(){
  return state.data.indicators.filter(item => item.series && item.kind !== 'rating');
}
function buildSeries(countryCode, indicatorKey){
  const indicator = getIndicator(indicatorKey);
  const labels = indicator.dates || indicator.years || [];
  const values = (indicator.series && indicator.series[countryCode]) || [];
  return labels.map((label, index) => {
      const rawValue = values[index];
      return { label, x:parseX(label), value:rawValue === null || rawValue === undefined ? null : Number(rawValue) };
    })
    .filter(point => Number.isFinite(point.x) && Number.isFinite(point.value))
    .sort((a,b) => a.x - b.x);
}
function safeSymbol(symbol){
  return String(symbol || '').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'index';
}
function indexRows(){
  return (state.indexData && state.indexData.indexes ? state.indexData.indexes : []).filter(item => item.symbol);
}
function getIndexRow(symbol){
  return indexRows().find(item => item.symbol === symbol) || indexRows()[0];
}
async function loadIndexHistory(symbol){
  const row = getIndexRow(symbol);
  const key = row.safeSymbol || safeSymbol(row.symbol);
  if(state.indexHistory[key]) return state.indexHistory[key];
  const response = await fetch(`indexes_data/${encodeURIComponent(key)}.json`, { cache:'no-store' });
  if(!response.ok) throw new Error(`Unable to load index history: ${key}`);
  const data = await response.json();
  state.indexHistory[key] = data;
  return data;
}
function buildIndexSeries(history){
  return (history.prices || []).map(candle => ({ label:candle.time, x:parseX(candle.time), value:Number(candle.close) }))
    .filter(point => Number.isFinite(point.x) && Number.isFinite(point.value))
    .sort((a,b) => a.x - b.x);
}
async function resolveIndicatorSelection(countryCode, indicatorKey){
  if(isIndexIndicator(indicatorKey)){
    const symbol = indexIndicatorSymbol(indicatorKey);
    const row = getIndexRow(symbol);
    const history = await loadIndexHistory(symbol);
    return {
      series: buildIndexSeries(history),
      meta: { code:row.country || '', label:row.fullName || row.name, short:row.name, unit:row.unit || 'Index Points', decimals:2 }
    };
  }
  const indicator = getIndicator(indicatorKey);
  const country = getCountry(countryCode);
  return {
    series: buildSeries(countryCode, indicatorKey),
    meta: { code:country.code, label:indicator.label, short:indicator.short || indicator.label, unit:indicator.unit, decimals:indicator.decimals }
  };
}
function applyPeriod(seriesA, seriesB){
  const all = seriesA.concat(seriesB);
  if(!all.length || state.period === 'all') return [seriesA, seriesB];
  const maxX = Math.max(...all.map(point => point.x));
  const minX = maxX - Number(state.period) * 12;
  return [seriesA.filter(point => point.x >= minX), seriesB.filter(point => point.x >= minX)];
}
function trimToOverlap(seriesA, seriesB){
  if(!seriesA.length || !seriesB.length) return [[], []];
  const minX = Math.max(seriesA[0].x, seriesB[0].x);
  const maxX = Math.min(seriesA[seriesA.length - 1].x, seriesB[seriesB.length - 1].x);
  if(maxX < minX) return [[], []];
  return [
    seriesA.filter(point => point.x >= minX && point.x <= maxX),
    seriesB.filter(point => point.x >= minX && point.x <= maxX)
  ];
}
function indexed(series){
  const first = series.find(point => Number.isFinite(point.value) && point.value !== 0);
  if(!first) return series;
  return series.map(point => ({ ...point, raw:point.value, value:(point.value / first.value) * 100 }));
}
function extent(series){
  const values = series.map(point => point.value).filter(Number.isFinite);
  if(!values.length) return [0, 1];
  let min = Math.min(...values), max = Math.max(...values);
  if(min === max){ min -= 1; max += 1; }
  const pad = (max - min) * .12;
  return [min - pad, max + pad];
}
function nearest(series, x){
  if(!series.length) return null;
  return series.reduce((best, point) => Math.abs(point.x - x) < Math.abs(best.x - x) ? point : best, series[0]);
}
function niceLabel(x){
  const rounded = Math.round(x);
  const year = Math.floor(rounded / 12);
  const month = rounded % 12;
  if(month === 0) return String(year);
  return `${year}-${String(month + 1).padStart(2,'0')}`;
}
function setupOptions(){
  const params = new URLSearchParams(location.search);
  state.type = params.get('type') === 'indexes' ? 'indexes' : 'indicators';
  const countries = state.data.countries;
  const indicators = eligibleIndicators();
  const countryOptions = countries.map(country => `<option value="${country.code}">${country.code} - ${country.name}</option>`).join('');
  const indicatorOptions = indicators.map(indicator => `<option value="${indicator.key}">${indicator.label}</option>`).join('');
  const us500 = indexRows().find(item => item.name === 'US500' || item.symbol === '^GSPC');
  const marketIndicatorOptions = us500
    ? `<optgroup label="Market Indexes"><option value="${INDEX_INDICATOR_PREFIX}${us500.symbol}">US500 - ${us500.fullName || 'S&P 500 Index'}</option></optgroup>`
    : '';
  [els.countryA, els.countryB].forEach(select => select.innerHTML = countryOptions);
  [els.indicatorA, els.indicatorB].forEach(select => select.innerHTML = indicatorOptions + marketIndicatorOptions);
  els.countryA.value = params.get('aCountry') || 'US';
  els.countryB.value = params.get('bCountry') || 'US';
  els.indicatorA.value = params.get('aIndicator') || 'gdp_growth';
  els.indicatorB.value = params.get('bIndicator') || (indicators.find(item => item.key === 'inflation') || indicators[1]).key;
  const indexOptions = indexRows().map(item => `<option value="${item.symbol}">${item.name} - ${item.fullName || item.name}</option>`).join('');
  [els.indexA, els.indexB].forEach(select => select.innerHTML = indexOptions);
  els.indexA.value = params.get('aIndex') || '^GSPC';
  els.indexB.value = params.get('bIndex') || '^NDX';
  syncTypeUi();
}
function syncTypeUi(){
  document.querySelectorAll('.compare-tab').forEach(button => button.classList.toggle('active', button.dataset.type === state.type));
  document.querySelectorAll('.indicator-fields').forEach(node => node.classList.toggle('hidden', state.type !== 'indicators'));
  document.querySelectorAll('.index-fields').forEach(node => node.classList.toggle('hidden', state.type !== 'indexes'));
  const label = state.type === 'indexes' ? 'Indexes' : 'Indicators';
  document.querySelector('.eyebrow').textContent = label;
  els.meta.textContent = state.type === 'indexes'
    ? `Updated ${(state.indexData && state.indexData.updated) || '--'} | ${(state.indexData && state.indexData.source) || 'Yahoo Finance indexes'}`
    : `Updated ${state.data.updated || '--'} | ${state.data.source || 'Public data sources'}`;
}
function updateUrl(){
  const params = state.type === 'indexes'
    ? new URLSearchParams({ type:'indexes', aIndex:els.indexA.value, bIndex:els.indexB.value })
    : new URLSearchParams({
      aCountry:els.countryA.value, aIndicator:els.indicatorA.value,
      bCountry:els.countryB.value, bIndicator:els.indicatorB.value
    });
  history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
}
function drawLine(series, xFor, yFor, color){
  if(series.length < 2) return;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  series.forEach((point, index) => {
    const x = xFor(point.x), y = yFor(point.value);
    const previous = series[index - 1];
    if(index === 0 || (previous && point.x - previous.x > 15)) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.restore();
}
async function draw(){
  const drawToken = ++state.drawToken;
  updateUrl();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const rect = els.chart.getBoundingClientRect();
  els.chart.width = Math.max(1, Math.floor(rect.width * dpr));
  els.chart.height = Math.max(1, Math.floor(rect.height * dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const width = rect.width, height = rect.height;
  ctx.clearRect(0,0,width,height);
  let a, b, metaA, metaB;
  try{
    if(state.type === 'indexes'){
      const rowA = getIndexRow(els.indexA.value);
      const rowB = getIndexRow(els.indexB.value);
      const [historyA, historyB] = await Promise.all([loadIndexHistory(rowA.symbol), loadIndexHistory(rowB.symbol)]);
      if(drawToken !== state.drawToken) return;
      a = buildIndexSeries(historyA);
      b = buildIndexSeries(historyB);
      metaA = { code:rowA.country || '', label:rowA.fullName || rowA.name, short:rowA.name, unit:rowA.unit || 'Index Points', decimals:2 };
      metaB = { code:rowB.country || '', label:rowB.fullName || rowB.name, short:rowB.name, unit:rowB.unit || 'Index Points', decimals:2 };
    } else {
      const [seriesA, seriesB] = await Promise.all([
        resolveIndicatorSelection(els.countryA.value, els.indicatorA.value),
        resolveIndicatorSelection(els.countryB.value, els.indicatorB.value)
      ]);
      if(drawToken !== state.drawToken) return;
      a = seriesA.series;
      b = seriesB.series;
      metaA = seriesA.meta;
      metaB = seriesB.meta;
    }
  }catch(error){
    els.empty.style.display = 'flex';
    els.empty.textContent = 'Unable to load comparable time series.';
    console.error(error);
    return;
  }
  [a,b] = trimToOverlap(a,b);
  [a,b] = applyPeriod(a,b);
  const rawA = a, rawB = b;
  if(state.indexed){ a = indexed(a); b = indexed(b); }
  els.empty.style.display = a.length && b.length ? 'none' : 'flex';
  els.legend.innerHTML = `
    <span class="legend-item"><span class="dot a"></span>${metaA.code} ${metaA.label}</span>
    <span class="legend-item"><span class="dot b"></span>${metaB.code} ${metaB.label}</span>
  `;
  const lastA = rawA[rawA.length - 1], lastB = rawB[rawB.length - 1];
  els.latest.innerHTML = `
    <div>${metaA.code} ${metaA.short}<strong>${lastA ? formatNumber(lastA.value, metaA.decimals, metaA.unit) : '--'}</strong></div>
    <div>${metaB.code} ${metaB.short}<strong>${lastB ? formatNumber(lastB.value, metaB.decimals, metaB.unit) : '--'}</strong></div>
  `;
  if(!a.length || !b.length) return;
  const left = width < 640 ? 42 : 56, right = width < 640 ? 46 : 60, top = 24, bottom = 44;
  const plotW = width - left - right, plotH = height - top - bottom;
  const all = a.concat(b);
  const minX = Math.min(...all.map(point => point.x)), maxX = Math.max(...all.map(point => point.x));
  const xFor = x => left + ((x - minX) / Math.max(1, maxX - minX)) * plotW;
  const yExtentA = state.indexed ? extent(all) : extent(a);
  const yExtentB = state.indexed ? yExtentA : extent(b);
  const yA = value => top + (1 - (value - yExtentA[0]) / (yExtentA[1] - yExtentA[0])) * plotH;
  const yB = value => top + (1 - (value - yExtentB[0]) / (yExtentB[1] - yExtentB[0])) * plotH;
  ctx.font = '700 11px Inter, Arial, sans-serif';
  ctx.lineWidth = 1;
  for(let i=0;i<=5;i++){
    const y = top + plotH * i / 5;
    ctx.strokeStyle = colors.grid;
    ctx.beginPath();ctx.moveTo(left, y);ctx.lineTo(width - right, y);ctx.stroke();
    const av = yExtentA[1] - (yExtentA[1] - yExtentA[0]) * i / 5;
    const bv = yExtentB[1] - (yExtentB[1] - yExtentB[0]) * i / 5;
    ctx.fillStyle = colors.blue;ctx.textAlign = 'left';ctx.fillText(formatNumber(av, 1, state.indexed ? '' : metaA.unit), 6, y + 4);
    ctx.fillStyle = colors.teal;ctx.textAlign = 'right';ctx.fillText(formatNumber(bv, 1, state.indexed ? '' : metaB.unit), width - 6, y + 4);
  }
  for(let i=0;i<=6;i++){
    const x = left + plotW * i / 6;
    ctx.strokeStyle = colors.grid;
    ctx.beginPath();ctx.moveTo(x, top);ctx.lineTo(x, top + plotH);ctx.stroke();
    ctx.fillStyle = colors.text;ctx.textAlign = 'center';
    ctx.fillText(niceLabel(minX + (maxX - minX) * i / 6), x, height - 18);
  }
  drawLine(a, xFor, yA, colors.blue);
  drawLine(b, xFor, state.indexed ? yA : yB, colors.teal);
  if(state.hover){
    const hoverXValue = minX + ((state.hover.x - left) / plotW) * (maxX - minX);
    const pa = nearest(a, hoverXValue), pb = nearest(b, hoverXValue);
    const hx = xFor(pa ? pa.x : pb.x);
    ctx.strokeStyle = 'rgba(17,17,17,.32)';
    ctx.beginPath();ctx.moveTo(hx, top);ctx.lineTo(hx, top + plotH);ctx.stroke();
    [pa, pb].filter(Boolean).forEach((point, index) => {
      const y = index === 0 ? yA(point.value) : (state.indexed ? yA(point.value) : yB(point.value));
      ctx.fillStyle = index === 0 ? colors.blue : colors.teal;
      ctx.beginPath();ctx.arc(hx, y, 4, 0, Math.PI*2);ctx.fill();
    });
    const tipX = Math.min(width - 220, Math.max(10, hx + 12));
    els.tip.style.display = 'block';
    els.tip.style.left = `${tipX}px`;
    els.tip.style.top = `${Math.max(10, top + 10)}px`;
    els.tip.innerHTML = `<b>${pa ? pa.label : pb.label}</b>
      <div class="tip-row"><span>${metaA.code} ${metaA.short}</span><span>${pa ? formatNumber(state.indexed ? (pa.raw || pa.value) : pa.value, metaA.decimals, metaA.unit) : '--'}</span></div>
      <div class="tip-row"><span>${metaB.code} ${metaB.short}</span><span>${pb ? formatNumber(state.indexed ? (pb.raw || pb.value) : pb.value, metaB.decimals, metaB.unit) : '--'}</span></div>`;
  } else {
    els.tip.style.display = 'none';
  }
}
async function init(){
  try{
    if(window.ECONOMIC_DATA){
      state.data = window.ECONOMIC_DATA;
    } else {
      const response = await fetch('economic_data.json', { cache:'no-store' });
      state.data = await response.json();
    }
    const indexResponse = await fetch('indexes_data.json', { cache:'no-store' });
    state.indexData = await indexResponse.json();
    setupOptions();
    draw();
  }catch(error){
    els.empty.style.display = 'flex';
    els.empty.textContent = 'Unable to load economic_data.json.';
    console.error(error);
  }
}
['change','input'].forEach(eventName => {
  [els.countryA, els.countryB, els.indicatorA, els.indicatorB, els.indexA, els.indexB].forEach(el => el.addEventListener(eventName, draw));
});
document.querySelectorAll('.compare-tab').forEach(button => button.addEventListener('click', () => {
  state.type = button.dataset.type;
  state.hover = null;
  syncTypeUi();
  draw();
}));
document.querySelectorAll('.period').forEach(button => button.addEventListener('click', () => {
  document.querySelectorAll('.period').forEach(item => item.classList.remove('active'));
  button.classList.add('active'); state.period = button.dataset.period; draw();
}));
els.modeBtn.addEventListener('click', () => {
  state.indexed = !state.indexed;
  els.modeBtn.classList.toggle('active', state.indexed);
  draw();
});
els.chart.addEventListener('mousemove', event => {
  const rect = els.chart.getBoundingClientRect();
  state.hover = { x:event.clientX - rect.left, y:event.clientY - rect.top };
  draw();
});
els.chart.addEventListener('mouseleave', () => { state.hover = null; draw(); });
window.addEventListener('resize', draw);
init();
</script>
</body>
</html>
