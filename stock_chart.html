<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Chart</title>
<link rel="stylesheet" href="nav_market.css">
<style>
:root{
  --tv-bg:#000;
  --tv-panel:#050709;
  --tv-panel-2:#090d12;
  --tv-border:#202932;
  --tv-border-soft:#111820;
  --tv-text:#d1d4dc;
  --tv-muted:#787b86;
  --tv-faint:#5d606b;
  --tv-blue:#2962ff;
  --tv-blue-soft:#1e3a8a;
  --tv-green:#00d109;
  --tv-red:#ff4d00;
  --tv-hover:#101820;
  --tv-accent:#00d109;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;background:var(--tv-bg);color:var(--tv-text);padding:0}
.site-nav{min-height:64px;display:flex;align-items:center;gap:28px;padding:0 24px;background:#000;border-bottom:1px solid #1b1f2a;position:relative;z-index:30}
.site-brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:25px;font-weight:800;letter-spacing:0;white-space:nowrap}
.brand-mark{position:relative;width:22px;height:26px;display:inline-block}
.brand-mark::before{content:"";position:absolute;left:7px;top:1px;width:10px;height:24px;background:#fff;border-radius:10px 10px 10px 1px;transform:skew(-18deg) rotate(22deg);transform-origin:center}
.brand-mark::after{content:"";position:absolute;left:2px;bottom:2px;width:13px;height:3px;background:#fff;border-radius:999px;transform:rotate(-34deg)}
.nav-check{position:absolute;opacity:0;pointer-events:none}
.nav-toggle{display:none;width:38px;height:38px;border:1px solid #2a2e39;border-radius:999px;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;margin-left:0}
.nav-toggle span{width:16px;height:2px;background:#fff;border-radius:999px}
.nav-search-icon{width:42px;height:42px;border:1px solid #2a2e39;border-radius:999px;background:#090c12;display:inline-flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;margin-left:auto;text-decoration:none}
.nav-search-icon::before{content:"";width:13px;height:13px;border:2px solid #d1d4dc;border-radius:50%}
.nav-search-icon::after{content:"";position:absolute;width:7px;height:2px;background:#d1d4dc;border-radius:999px;transform:translate(9px,9px) rotate(45deg)}
.nav-search-icon:hover{border-color:#d1d4dc;background:#101820}
.nav-search-icon span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.nav-links{display:flex;align-items:center;gap:28px;flex:0 1 auto}
.nav-link{position:relative;color:#f3f4f6;text-decoration:none;font-size:15px;font-weight:650;white-space:nowrap}
.nav-link:hover{color:#b8ff00}
.nav-link.active{color:#b8ff00}
.nav-link.active::after{display:none}
.nav-market{position:relative;display:flex;align-items:center}
.market-trigger{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;font:inherit}.market-trigger::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.market-menu{position:absolute;left:50%;top:100%;margin-top:8px;min-width:190px;padding:8px;border:1px solid #26313d;border-radius:8px;background:rgba(9,13,18,.96);box-shadow:0 18px 48px rgba(0,0,0,.48);transform:translateX(-50%) translateY(6px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .14s ease,transform .14s ease,visibility .14s ease;z-index:50}
.market-menu::before{content:"";position:absolute;left:0;right:0;top:-15px;height:15px}
.nav-market:hover .market-menu,.nav-market:focus-within .market-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.market-menu-link{display:flex;align-items:center;justify-content:space-between;gap:16px;height:34px;padding:0 10px;border-radius:5px;color:var(--tv-text);font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap}
.market-menu-link:hover,.market-menu-link.active{background:rgba(0,209,9,.16);color:#fff}
.market-menu-link.active::after{content:"";width:7px;height:12px;border-right:2px solid var(--tv-accent);border-bottom:2px solid var(--tv-accent);transform:rotate(45deg) translateY(-1px)}
.nav-search{position:relative;flex:0 1 360px;min-width:220px;margin-left:auto}
.nav-search input{width:100%;height:42px;border:1px solid #2a2e39;border-radius:999px;background:#090c12;color:#fff;padding:0 16px 0 42px;font-size:16px;font-weight:650;outline:none}
.nav-search input::placeholder{color:#787b86}
.nav-search input:focus{border-color:#3a4654;box-shadow:0 0 0 1px rgba(209,212,220,.14)}
.nav-search-mark{position:absolute;left:16px;top:50%;width:13px;height:13px;border:2px solid #d1d4dc;border-radius:50%;transform:translateY(-50%);pointer-events:none}
.nav-search-mark::after{content:"";position:absolute;width:7px;height:2px;background:#d1d4dc;border-radius:999px;right:-6px;bottom:-4px;transform:rotate(45deg)}
.nav-search-results{position:absolute;left:0;right:0;top:calc(100% + 8px);max-height:320px;overflow:auto;padding:6px;border:1px solid #26313d;border-radius:8px;background:rgba(9,13,18,.98);box-shadow:0 18px 48px rgba(0,0,0,.48);display:none;z-index:80;scrollbar-color:#2a3440 #080c12;scrollbar-width:thin}
.nav-search-results.open{display:block}
.nav-result{width:100%;border:0;background:transparent;color:var(--tv-text);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border-radius:5px;cursor:pointer;text-align:left}
.nav-result:hover,.nav-result.active{background:rgba(0,209,9,.14);color:#fff}
.nav-result-symbol{font-weight:850;font-size:13px;color:#fff}
.nav-result-name{font-size:12px;color:var(--tv-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-result-change{font-size:12px;font-weight:850;font-family:Inter,Arial,sans-serif}
.nav-result-change.up{color:var(--tv-green)}.nav-result-change.down{color:var(--tv-red)}
.container{width:100%;max-width:none;margin:0;padding:0}
.page-layout{display:grid;grid-template-columns:clamp(238px,14.3vw,284px) minmax(0,1fr);gap:10px;align-items:stretch;border:none;background:#000;padding:10px}
.page-layout.sidebar-collapsed{grid-template-columns:44px minmax(0,1fr)}
.stock-panel{position:sticky;top:10px;height:calc(100vh - 84px);min-height:520px;background:#020607;border:1px solid #263746;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.sidebar-collapsed .stock-panel{align-items:center}
.stock-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px;padding:0 14px;border-bottom:1px solid #162330}
.stock-panel-title{font-size:21px;font-weight:900;color:#fff;white-space:nowrap;letter-spacing:0}
.stock-panel-meta{display:flex;align-items:center;gap:10px;margin-left:auto}
.icon-btn{width:26px;height:26px;border:1px solid transparent;background:transparent;color:var(--tv-muted);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800}
.icon-btn:hover{background:var(--tv-hover);color:var(--tv-text)}
.stock-panel-body{padding:12px 9px 10px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.sidebar-collapsed .stock-panel-title,.sidebar-collapsed .stock-panel-body{display:none}
.filter-drawer{border:1px solid var(--tv-border);border-radius:4px;background:var(--tv-panel-2);overflow:visible}
.filter-drawer summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 8px;cursor:pointer;color:var(--tv-text);font-size:11px;font-weight:800}
.filter-drawer summary::-webkit-details-marker{display:none}
.filter-summary{min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.filter-title{color:var(--tv-text);font-weight:850;flex:0 0 auto}
.filter-values{min-width:0;color:var(--tv-muted);font-weight:750;overflow:hidden;text-overflow:ellipsis}
.filter-caret{color:var(--tv-muted);font-size:14px;line-height:1;transition:transform .18s ease}
.filter-drawer[open] .filter-caret{transform:rotate(180deg)}
.filter-fields{display:grid;gap:8px;padding:0 8px 8px;border-top:1px solid var(--tv-border-soft)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;color:var(--tv-muted);font-weight:800;text-transform:uppercase;letter-spacing:.2px}
.select{width:100%;border:1px solid var(--tv-border);background:var(--tv-panel-2);color:var(--tv-text);border-radius:4px;padding:7px 8px;font-size:12px;outline:none}
.select:focus{border-color:var(--tv-blue)}
.stock-list{min-height:0;overflow:auto;border:none;border-radius:0;background:transparent;scrollbar-color:#3a5063 transparent;scrollbar-width:thin;padding:0 5px 10px 0}
.stock-list::-webkit-scrollbar{width:8px;height:8px}
.stock-list::-webkit-scrollbar-track{background:transparent}
.stock-list::-webkit-scrollbar-thumb{background:#3a5063;border-radius:999px;border:0}
.stock-list::-webkit-scrollbar-thumb:hover{background:#52687a}
.stock-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-height:34px;border:none;background:transparent;color:#d7dae2;text-align:left;padding:0 9px;cursor:pointer;border-radius:6px;margin:0 0 5px}
.stock-row:hover{background:#0d171f;color:#fff}
.stock-row.active.up{background:rgba(0,209,9,.16);box-shadow:none}
.stock-row.active.down{background:rgba(255,77,0,.16);box-shadow:none}
.stock-row.active:not(.up):not(.down){background:#0d171f;box-shadow:none}
.stock-rank{display:none}
.stock-main{min-width:0;display:block;overflow:hidden}
.stock-symbol{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:850;color:#d7dae2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stock-value{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:850;color:#8b909c;white-space:nowrap}
.stock-value.up{color:var(--tv-green)}.stock-value.down{color:var(--tv-red)}
.main-panel{min-width:0;min-height:calc(100vh - 86px);display:flex;flex-direction:column;background:#000}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0;min-height:58px;padding:8px 12px;background:#000;border:none;border-bottom:1px solid var(--tv-border);border-radius:0;flex-wrap:wrap}
.identity{display:flex;flex-direction:column;gap:4px}
.symbol-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:22px;color:#fff;font-weight:800;letter-spacing:0}
.name{font-size:13px;color:var(--tv-muted)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--tv-muted)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;background:var(--tv-panel-2);border:1px solid var(--tv-border);color:var(--tv-muted);font-size:11px}
.price-line{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.last-price{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800;color:var(--tv-text)}
.change{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:800}
.change.up{color:var(--tv-green)}.change.down{color:var(--tv-red)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--tv-border);background:var(--tv-panel-2);color:var(--tv-muted);border-radius:4px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--tv-hover);color:var(--tv-text)}
.btn.active{background:var(--tv-accent);border-color:var(--tv-accent);color:#001b03}
.mobile-switcher{display:none}
.chart-shell{background:#000;border:none;border-radius:0;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:520px}
.chart-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-bottom:none;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.indicator-control{position:relative}
.indicator-trigger{height:30px;display:inline-flex;align-items:center;gap:7px}
.indicator-trigger::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.indicator-menu{position:absolute;left:0;top:calc(100% + 7px);z-index:30;width:220px;padding:7px;border:1px solid var(--tv-border);border-radius:6px;background:rgba(9,13,18,.98);box-shadow:0 16px 40px rgba(0,0,0,.48);display:none}
.indicator-control.open .indicator-menu{display:block}
.indicator-option{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;padding:0 9px;border-radius:4px;color:var(--tv-text);font-size:12px;font-weight:750;cursor:pointer}
.indicator-option:hover{background:var(--tv-hover)}
.indicator-option input{accent-color:var(--tv-accent);width:15px;height:15px}
.ma-group{display:flex;align-items:center;gap:8px;min-height:24px}
.ma-toggle{height:30px;border:1px solid var(--tv-border);background:var(--tv-panel-2);color:var(--tv-muted);border-radius:4px;padding:7px 10px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;font-weight:700;line-height:1}
.ma-toggle:hover{background:var(--tv-hover);color:var(--tv-text)}
.ma-chevron{width:12px;height:12px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s ease}
.ma-group:not(.collapsed) .ma-chevron{transform:rotate(180deg)}
.ma-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:Inter,Arial,sans-serif;font-size:11px;color:var(--tv-muted)}
.ma-group.collapsed .ma-legend{display:none}
.ma-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.ma-dot{width:18px;height:2px;border-radius:2px;display:inline-block}
.hint{font-size:11px;color:var(--tv-faint)}
.chart-wrap{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.status{padding:28px;text-align:center;color:var(--tv-muted);font-size:13px}
.status-title{display:block;color:var(--tv-text);font-size:15px;font-weight:800;margin-bottom:6px}
.status strong{color:var(--tv-blue)}
@media(max-width:768px){
  .site-nav{min-height:58px;padding:10px 14px;gap:10px;flex-wrap:wrap}
  .site-brand{font-size:21px}
  .brand-mark{width:20px;height:24px}
  .nav-toggle{display:flex}
  .nav-links,.nav-search{display:none;flex:0 0 100%;width:100%}
  .nav-check:checked ~ .nav-links{display:flex}
  .nav-check:checked ~ .nav-search{display:block}
  .nav-links{order:3;flex-direction:column;align-items:stretch;gap:4px;padding-top:8px}
  .nav-link{height:40px;display:flex;align-items:center;padding:0 4px;font-size:14px}
  .nav-link.active::after{display:none}
  .nav-market{display:block}
  .market-menu{position:static;opacity:1;visibility:visible;pointer-events:auto;transform:none;box-shadow:none;background:transparent;border:none;padding:0 0 0 12px;margin-top:0}
  .market-menu::before{display:none}
  .market-menu-link{height:34px;font-size:13px}
  .nav-search{order:4;min-width:0;margin-left:0;padding-top:8px}
  .nav-search input{height:40px;font-size:16px}
  .nav-search-results{top:calc(100% + 4px)}
  .container{padding:0}
  .page-layout{display:block;border:none}
  .main-panel{min-height:calc(100dvh - 78px)}
  .stock-panel{position:fixed;left:10px;right:10px;top:78px;bottom:10px;height:auto;min-height:0;z-index:20;box-shadow:0 20px 60px rgba(0,0,0,.45);display:none}
  .stock-panel.open{display:flex}
  .sidebar-collapsed .stock-panel-title,.sidebar-collapsed .stock-panel-body{display:flex}
  .sidebar-collapsed .stock-panel{align-items:stretch}
  .stock-panel-body{display:flex}
  .mobile-switcher{display:none}
  .mobile-switcher .select{flex:1;min-width:132px;width:auto}
  h1{font-size:19px}
  .last-price{font-size:18px}
  .chart-shell{min-height:calc(100dvh - 260px)}
  .chart-wrap{min-height:0}
  .chart-toolbar{border-bottom:none;padding:8px 10px}
  .topbar{border-bottom:none}
  .hint{display:none}
}

@media(max-width:720px){
  .site-brand{order:1}
  .nav-search-icon{order:2;width:38px;height:38px;margin-left:auto}
  .nav-toggle{order:3;margin-left:0}
  .nav-links{order:4}
}

</style>
</head>
<body>
<nav class="site-nav" aria-label="Primary">
  <a class="site-brand" href="index.html" aria-label="Net Data home"><span class="brand-mark" aria-hidden="true"></span><span>Net Data</span></a>
  <input class="nav-check" type="checkbox" id="navMenu">
  <label class="nav-toggle" for="navMenu" aria-label="Toggle navigation"><span></span><span></span><span></span></label>
  <div class="nav-links">
    <a class="nav-link" href="cot_noncommercial_history.html">Commercial</a>
    <div class="nav-market">
      <button class="nav-link active market-trigger" type="button" aria-haspopup="true">Market</button>
      <div class="market-menu" aria-label="Market sections">
        <a class="market-menu-link active" href="russell2000_top100.html?market=stock">Tops</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=commodities">Commodities</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=indexes">Indexes</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=shares">Stock</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=currencies">Currencies</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=crypto">Crypto</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=bonds">Bonds</a>
      </div>
    </div>
    <a class="nav-link" href="economy.html">Indicators</a>
    <a class="nav-link" href="market_pulse.html">Insight</a>
    <a class="nav-link" href="compare.html">Compare</a>
    <a class="nav-link" href="calendar.html">Calendar</a>
  </div>
  <a class="nav-search-icon" href="search.html" aria-label="Search"><span aria-hidden="true"></span></a>
</nav>

<main class="container">
  <div class="page-layout" id="pageLayout">
    <aside class="stock-panel" id="stockPanel" aria-label="Stock list">
      <div class="stock-panel-head">
        <span class="stock-panel-title">Stocks</span>
        <span class="stock-panel-meta">
          <button class="icon-btn" id="panelToggle" title="Toggle stock list" aria-label="Toggle stock list">‹</button>
        </span>
      </div>
      <div class="stock-panel-body">
        <details class="filter-drawer" id="filterDrawer">
          <summary>
            <span class="filter-summary">
              <span class="filter-title">Filters</span>
              <span class="filter-values" id="filterSummary">Russell 2000 · Gain · 1D · High to low</span>
            </span>
            <span class="filter-caret" aria-hidden="true">⌄</span>
          </summary>
          <div class="filter-fields">
            <div class="field">
              <label for="universeSelect">Universe</label>
              <select class="select" id="universeSelect"></select>
            </div>
            <div class="field">
              <label for="sortSelect">Sort</label>
              <select class="select" id="sortSelect">
                <option value="gain">Gain</option>
                <option value="rank">Rank</option>
                <option value="price">Price</option>
                <option value="marketCapNum">Market Cap</option>
                <option value="symbol">Symbol</option>
              </select>
            </div>
            <div class="field">
              <label for="metricSelect">Period</label>
              <select class="select" id="metricSelect">
                <option value="d">1D</option>
                <option value="w">1W</option>
                <option value="m">1M</option>
                <option value="m2">2M</option>
                <option value="q">3M</option>
                <option value="h">6M</option>
                <option value="y">YTD</option>
              </select>
            </div>
            <div class="field">
              <label for="directionSelect">Direction</label>
              <select class="select" id="directionSelect">
                <option value="desc">High to low</option>
                <option value="asc">Low to high</option>
              </select>
            </div>
          </div>
        </details>
        <div class="stock-list" id="stockList"></div>
      </div>
    </aside>

    <section class="main-panel">
      <div class="mobile-switcher">
        <button class="btn" id="mobileListToggle" type="button">Stocks</button>
        <select class="select" id="mobileSortSelect" aria-label="Mobile stock sort">
          <option value="gain">Gain</option>
          <option value="rank">Rank</option>
          <option value="price">Price</option>
          <option value="marketCapNum">Market Cap</option>
          <option value="symbol">Symbol</option>
        </select>
      </div>

  <div class="topbar">
    <div class="identity">
      <div class="symbol-line">
        <h1 id="symbol">---</h1>
        <span class="badge" id="sector">---</span>
        <span class="badge" id="mcap">---</span>
      </div>
      <div class="name" id="name">Loading chart...</div>
      <div class="price-line">
        <span class="last-price" id="lastPrice">--</span>
        <span class="change" id="change">--</span>
      </div>
    </div>
  </div>

  <section class="chart-shell">
    <div class="chart-toolbar">
      <div class="toolbar-left">
        <div class="actions" id="ranges">
          <button class="btn" data-range="63">3M</button>
          <button class="btn" data-range="126">6M</button>
          <button class="btn active" data-range="252">1Y</button>
          <button class="btn" data-range="504">2Y</button>
          <button class="btn" data-range="1260">5Y</button>
        </div>

<script>
const params = new URLSearchParams(window.location.search);
let currentSymbol = (params.get('symbol') || '').trim().toUpperCase();
let fallbackName = params.get('name') || currentSymbol;
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const maGroup = document.getElementById('maGroup');
const maToggle = document.getElementById('maToggle');
const indicatorControl = document.getElementById('indicatorControl');
const indicatorTrigger = document.getElementById('indicatorTrigger');
const pageLayout = document.getElementById('pageLayout');
const stockPanel = document.getElementById('stockPanel');
const stockListEl = document.getElementById('stockList');
const universeSelect = document.getElementById('universeSelect');
const sortSelect = document.getElementById('sortSelect');
const mobileSortSelect = document.getElementById('mobileSortSelect');
const metricSelect = document.getElementById('metricSelect');
const directionSelect = document.getElementById('directionSelect');
const filterSummary = document.getElementById('filterSummary');
const MOVING_AVERAGES = [
  { key:'ma10', label:'MA10', period:10, color:'#6f7b82', alpha:0.55 },
  { key:'ma20', label:'MA20', period:20, color:'#2aa8ff', alpha:0.9 },
  { key:'ma50', label:'MA50', period:50, color:'#7b61ff', alpha:0.5 },
  { key:'ma200', label:'MA200', period:200, color:'#c36a00', alpha:0.72 }
];
const UNIVERSE_LABELS = { r2kRaw:'Russell 2000', spRaw:'S&P 500', ndqRaw:'Nasdaq 100', all:'All Stocks' };
const SORT_LABELS = { gain:'Gain', rank:'Rank', price:'Price', marketCapNum:'Market Cap', symbol:'Symbol' };
const METRIC_LABELS = { d:'1D', w:'1W', m:'1M', m2:'2M', q:'3M', h:'6M', y:'YTD' };
const DIRECTION_LABELS = { desc:'High to low', asc:'Low to high' };
const DESKTOP_DEFAULT_RANGE = '252';
const MOBILE_DEFAULT_RANGE = '63';
const TOUCH_INSPECT_DELAY = 350;
const TOUCH_PAN_THRESHOLD = 7;
const STOCK_SWIPE_THRESHOLD = 72;
const DENSE_LINE_STEP = 5;
const state = {
  candles: [], start: 0, end: 0, hover: -1, hoverY: null, dragging: false, dragX: 0, dragStart: 0, dragEnd: 0,
  pinching: false, pinchDistance: 0, pinchStart: 0, pinchEnd: 0, pinchRatio: 0.5,
  touchMode: 'idle', touchTimer: null, touchStartX: 0, touchStartY: 0, touchCurrentX: 0, touchCurrentY: 0,
  maCollapsed: true, showMa: params.get('ma') !== '0', showEma: false, showBollinger: false,
  showVolume: true, showRsi: false, showMacd: true, showTongDaXin: params.get('td') === '1',
  marketIndex: null, stockRows: [], activeRange: null,
  universe: params.get('universe') || 'r2kRaw',
  metric: params.get('metric') || 'd',
  sortKey: normalizeSortKey(params.get('sort') || 'gain'),
  sortDir: params.get('dir') === 'asc' ? 'asc' : 'desc'
};
const chartCache = new Map();
const stockRowDataBySymbol = new Map();
const stockButtonBySymbol = new Map();
let activeChartRequest = 0;
let pendingLayoutRedraw = false;
let activeStockButton = null;

document.getElementById('symbol').textContent = currentSymbol || 'UNKNOWN';
document.getElementById('name').textContent = fallbackName || 'Stock chart';
document.title = currentSymbol ? currentSymbol + ' Candlestick Chart' : 'Stock Chart';

function normalizeSortKey(key){
  if(key === 'mcapNum') return 'marketCapNum';
  if(['gain','rank','price','marketCapNum','symbol'].includes(key)) return key;
  return 'gain';
}

function fmt(value, digits=2){
  if(value === null || value === undefined || Number.isNaN(Number(value))) return '--';
  return Number(value).toFixed(digits);
}

function fmtAxisPrice(value){
  if(value === null || value === undefined || Number.isNaN(Number(value))) return '--';
  return Math.round(Number(value)).toLocaleString('en-US');
}

function fmtPct(value){
  if(value === null || value === undefined || Number.isNaN(Number(value))) return '--';
  const numeric = Number(value);
  return (numeric >= 0 ? '+' : '') + numeric.toFixed(2) + '%';
}

function chartRegions(width, height){
  const padBox = chartPadding(width);
  const bottom = padBox.bottom;
  const volumeHeight = state.showVolume ? Math.max(54, Math.min(82, height * 0.14)) : 0;
  const rsiHeight = state.showRsi ? Math.max(68, Math.min(96, height * 0.15)) : 0;
  const macdHeight = state.showMacd ? Math.max(72, Math.min(108, height * 0.17)) : 0;
  const activePanels = [volumeHeight, rsiHeight, macdHeight].filter(Boolean).length;
  const lowerGap = Math.max(0, activePanels - 1) * 10;
  const panelGap = activePanels ? 16 : 0;
  const lowerHeight = volumeHeight + rsiHeight + macdHeight + lowerGap;
  return {
    indicatorTop: height - bottom - lowerHeight,
    priceBottom: height - bottom - lowerHeight - panelGap
  };
}

function setStatus(text){
  statusEl.style.display = text ? 'block' : 'none';
  statusEl.textContent = text || '';
}

function setStatusHtml(html){
  statusEl.style.display = html ? 'block' : 'none';
  statusEl.innerHTML = html || '';
}

function defaultChartRange(){
  return window.matchMedia && window.matchMedia('(max-width: 768px)').matches ? MOBILE_DEFAULT_RANGE : DESKTOP_DEFAULT_RANGE;
}

function setRange(range){
  const total = state.candles.length;
  const normalizedRange = String(range || defaultChartRange());
  const count = Math.min(total, Number(normalizedRange));
  state.activeRange = normalizedRange;
  state.end = total;
  state.start = Math.max(0, total - count);
  state.hover = -1;
  state.hoverY = null;
  updateHeaderPrice(total - 1);
  document.querySelectorAll('#ranges .btn').forEach(item => item.classList.toggle('active', item.dataset.range === normalizedRange));
  draw();
}

function renderHeader(data){
  const candles = data.prices;
  document.getElementById('symbol').textContent = data.symbol;
  document.getElementById('name').textContent = data.name || fallbackName || data.symbol;
  document.getElementById('sector').textContent = data.sector || 'Sector';
  document.getElementById('mcap').textContent = data.marketCap || 'Market cap';
  updateHeaderPrice(candles.length - 1);
  document.title = data.symbol + ' Candlestick Chart';
}

function renderHeaderFromRow(row){
  if(!row) return;
  const symbol = rowSymbol(row);
  const name = rowName(row);
  const price = Number(row.price || row.p || 0);
  const pct = Number(row.d || 0);
  const changeEl = document.getElementById('change');
  document.getElementById('symbol').textContent = symbol;
  document.getElementById('name').textContent = name || symbol;
  document.getElementById('sector').textContent = row.sector || row.exchange || 'Stock';
  document.getElementById('mcap').textContent = row.marketCap || 'Market cap';
  document.getElementById('lastPrice').textContent = price ? fmt(price) : '--';
  changeEl.textContent = (pct >= 0 ? '+' : '') + fmt(pct) + '%';
  changeEl.className = 'change ' + (pct >= 0 ? 'up' : 'down');
  document.title = symbol + ' Candlestick Chart';
}

function updateHeaderPrice(index){
  if(!state.candles.length) return;
  const safeIndex = Math.max(0, Math.min(state.candles.length - 1, index));
  const candle = state.candles[safeIndex];
  const prev = state.candles[safeIndex - 1] || candle;
  const close = Number(candle.close);
  const prevClose = Number(prev.close);
  const diff = close - prevClose;
  const pct = prevClose ? diff / prevClose * 100 : 0;
  const changeEl = document.getElementById('change');
  document.getElementById('lastPrice').textContent = fmt(close);
  changeEl.textContent = (diff >= 0 ? '+' : '') + fmt(diff) + ' (' + (pct >= 0 ? '+' : '') + fmt(pct) + '%)';
  changeEl.className = 'change ' + (diff >= 0 ? 'up' : 'down');
}

function updateHeaderForHover(){
  const selected = state.hover >= 0 ? state.hover : state.candles.length - 1;
  updateHeaderPrice(selected);
}

function resizeCanvas(){
  draw();
}

function syncCanvasSize(rect){
  const dpr = window.devicePixelRatio || 1;
  const nextWidth = Math.max(1, Math.floor(rect.width * dpr));
  const nextHeight = Math.max(1, Math.floor(rect.height * dpr));
  if(canvas.width !== nextWidth || canvas.height !== nextHeight){
    canvas.width = nextWidth;
    canvas.height = nextHeight;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function queueLayoutRedraw(width, height){
  if(pendingLayoutRedraw) return;
  pendingLayoutRedraw = true;
  requestAnimationFrame(() => {
    pendingLayoutRedraw = false;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const bitmapWidth = Math.max(1, Math.floor(rect.width * dpr));
    const bitmapHeight = Math.max(1, Math.floor(rect.height * dpr));
    const cssChanged = Math.abs(rect.width - width) > 0.5 || Math.abs(rect.height - height) > 0.5;
    const bitmapChanged = canvas.width !== bitmapWidth || canvas.height !== bitmapHeight;
    if(cssChanged || bitmapChanged) draw();
  });
}

function visibleCandles(){
  return state.candles.slice(state.start, state.end);
}

function calculateMovingAverages(candles){
  MOVING_AVERAGES.forEach(ma => {
    let sum = 0;
    candles.forEach((candle, index) => {
      sum += candle.close;
      if(index >= ma.period) sum -= candles[index - ma.period].close;
      candle[ma.key] = index >= ma.period - 1 ? sum / ma.period : null;
    });
  });
}

function calculateMacd(candles){
  let ema12 = null;
  let ema26 = null;
  let signal = null;
  const k12 = 2 / 13;
  const k26 = 2 / 27;
  const k9 = 2 / 10;
  candles.forEach(candle => {
    const close = Number(candle.close);
    ema12 = ema12 === null ? close : close * k12 + ema12 * (1 - k12);
    ema26 = ema26 === null ? close : close * k26 + ema26 * (1 - k26);
    const macd = ema12 - ema26;
    signal = signal === null ? macd : macd * k9 + signal * (1 - k9);
    candle.macd = macd;
    candle.macdSignal = signal;
    candle.macdHist = macd - signal;
  });
}

function calculateTechnicalIndicators(candles){
  let ema20 = null, ema50 = null;
  const k20 = 2 / 21, k50 = 2 / 51;
  let avgGain = 0, avgLoss = 0;
  candles.forEach((candle, index) => {
    const close = Number(candle.close);
    ema20 = ema20 === null ? close : close * k20 + ema20 * (1 - k20);
    ema50 = ema50 === null ? close : close * k50 + ema50 * (1 - k50);
    candle.ema20 = ema20;
    candle.ema50 = ema50;
    if(index >= 19){
      const window = candles.slice(index - 19, index + 1).map(item => Number(item.close));
      const mean = window.reduce((sum, value) => sum + value, 0) / 20;
      const deviation = Math.sqrt(window.reduce((sum, value) => sum + Math.pow(value - mean, 2), 0) / 20);
      candle.bbMiddle = mean;
      candle.bbUpper = mean + deviation * 2;
      candle.bbLower = mean - deviation * 2;
    }
    if(index === 0){ candle.rsi = null; return; }
    const change = close - Number(candles[index - 1].close);
    const gain = Math.max(change, 0), loss = Math.max(-change, 0);
    if(index <= 14){
      avgGain += gain / 14; avgLoss += loss / 14;
      candle.rsi = index === 14 ? (avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss)) : null;
    }else{
      avgGain = (avgGain * 13 + gain) / 14;
      avgLoss = (avgLoss * 13 + loss) / 14;
      candle.rsi = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
    }
  });
}

function calculateTDSequential(candles){
  let upCount = 0;
  for(let i = 0; i < candles.length; i++){
    if(i >= 4 && Number(candles[i].close) > Number(candles[i - 4].close)){
      upCount++;
    }else{
      upCount = 0;
    }
    candles[i].tdUp = upCount;
    candles[i].tdUp9 = upCount === 9;
  }
  let dnCount = 0;
  for(let i = 0; i < candles.length; i++){
    if(i >= 4 && Number(candles[i].close) < Number(candles[i - 4].close)){
      dnCount++;
    }else{
      dnCount = 0;
    }
    candles[i].tdDn = dnCount;
    candles[i].tdDn9 = dnCount === 9;
  }
  if(candles.length > 0){
    const last = candles[candles.length - 1];
    if(last.tdUp >= 5 && last.tdUp <= 8) last.tdUpPending = last.tdUp;
    if(last.tdDn >= 5 && last.tdDn <= 8) last.tdDnPending = last.tdDn;
  }
}

function calculateLifeLine(candles){
  let ema1 = null, ema2 = null;
  const k = 2 / 11;
  for(let i = 0; i < candles.length; i++){
    const c = Number(candles[i].close);
    ema1 = ema1 === null ? c : c * k + ema1 * (1 - k);
    ema2 = ema2 === null ? c : ema1 * k + ema2 * (1 - k);
    candles[i].lifeLine = ema2;
    candles[i].lifeUp = i > 0 && ema2 > candles[i - 1].lifeLine;
  }
}

function visibleRangeYears(candles){
  if(!candles || candles.length < 2) return 0;
  const first = new Date(candles[0].time).getTime();
  const last = new Date(candles[candles.length - 1].time).getTime();
  if(!Number.isFinite(first) || !Number.isFinite(last)) return 0;
  return Math.abs(last - first) / (365.25 * 24 * 60 * 60 * 1000);
}

function shouldUseLineMode(candles, step){
  const isMobile = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
  const years = visibleRangeYears(candles);
  return years >= (isMobile ? 2 : 5);
}

function isDenseLineMode(){
  const rect = canvas.getBoundingClientRect();
  const candles = visibleCandles();
  const count = Math.max(1, candles.length);
  const step = plotWidthFor(rect.width) / count;
  return shouldUseLineMode(candles, step);
}

function renderMaLegend(candle){
  const target = document.getElementById('maLegend');
  const denseLineMode = isDenseLineMode();
  maGroup.classList.toggle('collapsed', state.maCollapsed || denseLineMode);
  maToggle.setAttribute('aria-expanded', String(!state.maCollapsed && !denseLineMode));
  maToggle.setAttribute('aria-label', state.maCollapsed || denseLineMode ? 'Expand moving averages' : 'Collapse moving averages');
  maToggle.title = denseLineMode ? 'Moving averages hidden in dense line mode' : (state.maCollapsed ? 'Expand moving averages' : 'Collapse moving averages');
  if(state.maCollapsed || denseLineMode){
    target.innerHTML = '';
    return;
  }
  target.innerHTML = MOVING_AVERAGES.map(ma => {
    const value = candle && candle[ma.key] ? fmt(candle[ma.key]) : '--';
    return '<span class="ma-item" style="color:'+ma.color+';opacity:'+ma.alpha+'"><span class="ma-dot" style="background:'+ma.color+'"></span>'+ma.label+' '+value+'</span>';
  }).join('');
}

function drawMovingAverage(ma, candles, xFor, yFor){
  ctx.strokeStyle = ma.color;
  ctx.lineWidth = 1.4;
  ctx.globalAlpha = ma.alpha;
  ctx.beginPath();
  let started = false;
  candles.forEach((candle, index) => {
    const value = candle[ma.key];
    if(!value){
      started = false;
      return;
    }
    const x = xFor(index);
    const y = yFor(value);
    if(!started){
      ctx.moveTo(x, y);
      started = true;
    }else{
      ctx.lineTo(x, y);
    }
  });
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawGrid(left, top, right, priceBottom, bottom, width, height, minPrice, maxPrice, candles, xFor){
  const compact = width <= 520;
  const gridDivisions = 8;
  ctx.strokeStyle = 'rgba(110, 116, 128, 0.28)';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#d7d9df';
  ctx.font = (compact ? '10px' : '13px') + ' Inter, Arial, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for(let i=0;i<=gridDivisions;i++){
    const y = top + (priceBottom - top) * i / gridDivisions;
    const price = maxPrice - (maxPrice - minPrice) * i / gridDivisions;
    if(!compact){
      ctx.beginPath();
      ctx.moveTo(0, Math.round(y) + 0.5);
      ctx.lineTo(width - right + 4, Math.round(y) + 0.5);
      ctx.stroke();
    }
    ctx.fillText(fmtAxisPrice(price), width - 8, y);
  }
  ctx.strokeStyle = 'rgba(110, 116, 128, 0.28)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  const ticks = Math.min(gridDivisions + 1, candles.length);
  for(let i=0;i<ticks;i++){
    const idx = Math.floor(i * (candles.length - 1) / Math.max(1, ticks - 1));
    const x = xFor(idx);
    if(!compact){
      ctx.beginPath();
      ctx.moveTo(Math.round(x) + 0.5, top);
      ctx.lineTo(Math.round(x) + 0.5, priceBottom);
      ctx.stroke();
    }
    ctx.fillText(candles[idx].time.slice(5), x, height - bottom + 8);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
}

function drawPanelLabel(label, top){
  ctx.fillStyle = '#8b909b';
  ctx.font = '12px Inter, Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(label, 8, top + 4);
}

function drawVolumePanel(candles, xFor, step, top, bottom, maxVolume, height){
  drawPanelLabel(maxVolume ? Math.round(maxVolume / 1000000) + 'M' : 'VOL', top);
  if(!maxVolume) return;
  const panelHeight = Math.max(1, bottom - top - 10);
  const barWidth = Math.max(1, Math.min(7, step * 0.38));
  candles.forEach((c, i) => {
    if(!c.volume) return;
    const x = xFor(i);
    const up = c.close >= c.open;
    const vh = Math.max(1, (c.volume / maxVolume) * panelHeight);
    ctx.fillStyle = up ? 'rgba(0, 209, 9, 0.34)' : 'rgba(255, 77, 0, 0.34)';
    ctx.fillRect(x - barWidth / 2, bottom - vh, barWidth, vh);
  });
}

function drawMacdPanel(candles, xFor, step, top, bottom, width){
  drawPanelLabel('MACD', top);
  const values = candles.flatMap(c => [c.macd, c.macdSignal, c.macdHist]).filter(value => Number.isFinite(value));
  const maxAbs = Math.max(...values.map(value => Math.abs(value)), 0) || 1;
  const panelTop = top + 16;
  const panelBottom = bottom - 2;
  const zeroY = panelTop + (panelBottom - panelTop) / 2;
  const yForMacd = value => zeroY - (value / maxAbs) * ((panelBottom - panelTop) / 2);
  const barWidth = Math.max(1, Math.min(7, step * 0.36));
  ctx.strokeStyle = '#26323b';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, zeroY);
  ctx.lineTo(width, zeroY);
  ctx.stroke();
  candles.forEach((c, i) => {
    if(!Number.isFinite(c.macdHist)) return;
    const x = xFor(i);
    const y = yForMacd(c.macdHist);
    const barTop = Math.min(y, zeroY);
    const barHeight = Math.max(1, Math.abs(zeroY - y));
    ctx.fillStyle = c.macdHist >= 0 ? 'rgba(0, 209, 9, 0.34)' : 'rgba(255, 77, 0, 0.34)';
    ctx.fillRect(x - barWidth / 2, barTop, barWidth, barHeight);
  });
  [
    { key:'macd', color:'#00bcd4', alpha:0.58 },
    { key:'macdSignal', color:'#ff9800', alpha:0.5 }
  ].forEach(line => {
    ctx.strokeStyle = line.color;
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = line.alpha;
    ctx.beginPath();
    let started = false;
    candles.forEach((c, i) => {
      const value = c[line.key];
      if(!Number.isFinite(value)){
        started = false;
        return;
      }
      const x = xFor(i);
      const y = yForMacd(value);
      if(!started){
        ctx.moveTo(x, y);
        started = true;
      }else{
        ctx.lineTo(x, y);
      }
    });
    ctx.stroke();
    ctx.globalAlpha = 1;
  });
}

function drawIndicatorLine(candles, key, xFor, yFor, color, alpha=0.85, width=1.3){
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.globalAlpha = alpha; ctx.beginPath();
  let started = false;
  candles.forEach((candle, index) => {
    const value = candle[key];
    if(!Number.isFinite(value)){ started = false; return; }
    const x = xFor(index), y = yFor(value);
    if(!started){ ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  });
  ctx.stroke(); ctx.globalAlpha = 1;
}

function drawRsiPanel(candles, xFor, top, bottom, width){
  drawPanelLabel('RSI 14', top);
  const panelTop = top + 16, panelBottom = bottom - 2;
  const yForRsi = value => panelTop + (100 - value) / 100 * (panelBottom - panelTop);
  ctx.strokeStyle = '#26323b'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
  [30,70].forEach(level => { const y=yForRsi(level); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke(); });
  ctx.setLineDash([]);
  drawIndicatorLine(candles, 'rsi', xFor, yForRsi, '#b26cff', 0.9, 1.4);
}

function roundedRectPath(x, y, width, height, radius){
  const r = Math.min(radius, width / 2, height / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + width - r, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + r);
  ctx.lineTo(x + width, y + height - r);
  ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
  ctx.lineTo(x + r, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
}

function drawAxisLabel(text, x, y, options={}){
  const paddingX = options.paddingX ?? 8;
  const height = options.height ?? 22;
  const radius = options.radius ?? 4;
  ctx.font = options.font || '12px Inter, Arial, sans-serif';
  const width = Math.ceil(ctx.measureText(text).width) + paddingX * 2;
  const desiredLeft = options.align === 'right' ? x - width : x;
  const maxLeft = options.maxRight ? options.maxRight - width : (options.maxLeft ?? desiredLeft);
  const left = Math.max(2, Math.min(desiredLeft, maxLeft));
  const top = Math.max(2, Math.min(y - height / 2, options.maxTop ?? y - height / 2));
  ctx.fillStyle = options.background || '#1d2430';
  roundedRectPath(left, top, width, height, radius);
  ctx.fill();
  if(options.border){
    ctx.strokeStyle = options.border;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.fillStyle = options.color || '#d7d9df';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, left + width / 2, top + height / 2);
}

function updateHistoryMeta(){
  if(!state.candles.length) return;
  const first = state.candles[0].time;
  const last = state.candles[state.candles.length - 1].time;
  const visible = visibleCandles();
  const shown = visible.length ? visible[0].time + ' to ' + visible[visible.length - 1].time : '--';
  const hint = document.querySelector('.hint');
  if(hint){
    hint.textContent = 'History ' + first + ' to ' + last + ' · Showing ' + shown + ' · Drag to pan · Wheel or pinch to zoom';
  }
}

function chartPadding(width){
  if(width <= 380) return { left: 4, right: 42, top: 18, bottom: 28 };
  if(width <= 520) return { left: 5, right: 46, top: 18, bottom: 30 };
  return { left: 6, right: 56, top: 22, bottom: 36 };
}

function plotWidthFor(width){
  const pad = chartPadding(width);
  return Math.max(1, width - pad.left - pad.right);
}

function drawTongDaXin(candles, xFor, yFor, bodyWidth, wickWidth, chartTop, priceBottom){
  // ── TD Sequential with BACKSET: show count 1-9 on bars ──
  ctx.font='bold 11px Inter,Arial';ctx.textAlign='center';
  for(let i=0;i<candles.length;i++){
    let upCount=candles[i].tdUp||0;
    if(upCount>0){
      // BACKSET: mark next 9 bars back when 9 is reached
      let peak=i,count=upCount;
      if(upCount===9){
        for(let j=0;j<9;j++){if(i-j>=0&&candles[i-j].tdUp>=j+1)peak=i-j;}
        count=9;
      }
      // Show count number for last bar's incomplete sequence
      if(i===candles.length-1&&upCount>=5&&upCount<=8){
        for(let j=0;j<upCount;j++){
          const bi=i-j;if(bi<0)continue;
          const x=xFor(bi);
          ctx.fillStyle='#ff00ff';
          ctx.fillText(upCount-j,x,yFor(candles[bi].high)-bodyWidth*2.5);
        }
      }
      if(upCount===9){
        for(let j=0;j<9;j++){
          const bi=i-j;if(bi<0)continue;
          const x=xFor(bi);
          if(j===0){ctx.fillStyle='#00d109';ctx.fillText('9',x,yFor(candles[bi].high)-bodyWidth*2.5);}
        }
      }
    }
    let dnCount=candles[i].tdDn||0;
    if(dnCount>0){
      if(dnCount===9){
        ctx.fillStyle='#ff4d00';
        ctx.fillText('9',xFor(i),yFor(candles[i].low)+bodyWidth*2.5+12);
      }
      if(i===candles.length-1&&dnCount>=5&&dnCount<=8){
        for(let j=0;j<dnCount;j++){
          const bi=i-j;if(bi<0)continue;
          const x=xFor(bi);
          ctx.fillStyle='#ff00ff';
          ctx.fillText(dnCount-j,x,yFor(candles[bi].low)+bodyWidth*2.5+12);
        }
      }
    }
  }

  // ── 生命线: EMA(EMA(C,10),10) blue=rising, red=falling ──
  ctx.lineWidth=3;ctx.lineJoin='round';
  let lastUp=null,segStart=false;
  for(let i=0;i<candles.length;i++){
    if(candles[i].lifeLine==null)continue;
    const x=xFor(i),y=yFor(candles[i].lifeLine);
    if(y<chartTop||y>priceBottom)continue;
    const up=candles[i].lifeUp;
    if(up!==lastUp){
      if(segStart)ctx.stroke();
      ctx.beginPath();segStart=true;
      ctx.strokeStyle=up?'#2962ff':'#ff4d00';
      ctx.moveTo(x,y);
      lastUp=up;
    }else{
      ctx.lineTo(x,y);
    }
  }
  if(segStart)ctx.stroke();

  // ── 缠论 pivot support/resistance ──
  const HI=10,LO=10;
  const pivotsH=[],pivotsL=[];
  for(let i=HI;i<candles.length-HI;i++){
    const h=Number(candles[i].high);
    let isHigh=true;
    for(let j=i-HI;j<=i+HI;j++){if(j!==i&&Number(candles[j].high)>h){isHigh=false;break;}}
    if(isHigh)pivotsH.push({idx:i,price:h});
  }
  for(let i=LO;i<candles.length-LO;i++){
    const l=Number(candles[i].low);
    let isLow=true;
    for(let j=i-LO;j<=i+LO;j++){if(j!==i&&Number(candles[j].low)<l){isLow=false;break;}}
    if(isLow)pivotsL.push({idx:i,price:l});
  }
  ctx.setLineDash([6,3]);ctx.lineWidth=1.5;
  for(let ph=1;ph<pivotsH.length;ph++){
    const p0=pivotsH[ph-1],p1=pivotsH[ph];
    ctx.strokeStyle='rgba(0,209,9,0.5)';ctx.beginPath();
    ctx.moveTo(xFor(p0.idx),yFor(p0.price));
    ctx.lineTo(xFor(p1.idx),yFor(p1.price));ctx.stroke();
  }
  for(let pl=1;pl<pivotsL.length;pl++){
    const p0=pivotsL[pl-1],p1=pivotsL[pl];
    ctx.strokeStyle='rgba(255,77,0,0.5)';ctx.beginPath();
    ctx.moveTo(xFor(p0.idx),yFor(p0.price));
    ctx.lineTo(xFor(p1.idx),yFor(p1.price));ctx.stroke();
  }
  ctx.setLineDash([]);
}

function draw(){
  const readoutIndex = state.hover >= state.start && state.hover < state.end ? state.hover : state.end - 1;
  renderMaLegend(state.candles[readoutIndex]);

  const rect = canvas.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;
  syncCanvasSize(rect);
  const candles = visibleCandles();
  if(!candles.length) return;
  updateHistoryMeta();

  const padBox = chartPadding(width);
  const left = padBox.left, right = padBox.right, top = padBox.top, bottom = padBox.bottom;
  const regions = chartRegions(width, height);
  const volumeHeight = state.showVolume ? Math.max(54, Math.min(82, height * 0.14)) : 0;
  const rsiHeight = state.showRsi ? Math.max(68, Math.min(96, height * 0.15)) : 0;
  const macdHeight = state.showMacd ? Math.max(72, Math.min(108, height * 0.17)) : 0;
  const activePanels = [volumeHeight, rsiHeight, macdHeight].filter(Boolean).length;
  const panelGap = activePanels ? 16 : 0;
  const priceBottom = regions.priceBottom;
  let panelTop = priceBottom + panelGap;
  const volumeTop = state.showVolume ? panelTop : 0;
  const volumeBottom = state.showVolume ? volumeTop + volumeHeight : 0;
  if(state.showVolume) panelTop = volumeBottom + ((state.showRsi || state.showMacd) ? 10 : 0);
  const rsiTop = state.showRsi ? panelTop : 0;
  const rsiBottom = state.showRsi ? rsiTop + rsiHeight : 0;
  if(state.showRsi) panelTop = rsiBottom + (state.showMacd ? 10 : 0);
  const macdTop = state.showMacd ? panelTop : 0;
  const macdBottom = state.showMacd ? height - bottom : 0;
  const plotWidth = width - left - right;
  const step = plotWidth / candles.length;
  const denseLineMode = shouldUseLineMode(candles, step);
  const bodyWidth = Math.max(3, Math.min(13, step * 0.62));
  const wickWidth = Math.max(2, Math.min(7, bodyWidth * 0.36));
  const maValues = [];
  if(!denseLineMode && state.showMa){
    candles.forEach(c => MOVING_AVERAGES.forEach(ma => { if(c[ma.key]) maValues.push(c[ma.key]); }));
  }
  if(state.showEma) candles.forEach(c => { if(c.ema20) maValues.push(c.ema20); if(c.ema50) maValues.push(c.ema50); });
  if(state.showBollinger) candles.forEach(c => { if(c.bbUpper) maValues.push(c.bbUpper); if(c.bbLower) maValues.push(c.bbLower); });
  if(state.showTongDaXin) candles.forEach(c => { if(c.lifeLine != null) maValues.push(c.lifeLine); });
  const highs = candles.map(c => denseLineMode ? c.close : c.high).concat(maValues);
  const lows = candles.map(c => denseLineMode ? c.close : c.low).concat(maValues);
  let maxPrice = Math.max(...highs);
  let minPrice = Math.min(...lows);
  const pad = (maxPrice - minPrice || maxPrice || 1) * 0.06;
  maxPrice += pad;
  minPrice -= pad;
  const maxVolume = Math.max(...candles.map(c => c.volume || 0), 0);
  const xFor = i => left + i * step + step / 2;
  const yFor = price => top + (maxPrice - price) / (maxPrice - minPrice) * (priceBottom - top);

  drawGrid(left, top, right, priceBottom, bottom, width, height, minPrice, maxPrice, candles, xFor);

  if(denseLineMode){
    const trendUp = Number(candles[candles.length - 1].close) >= Number(candles[0].close);
    ctx.strokeStyle = trendUp ? '#00d109' : '#ff4d00';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    candles.forEach((c, i) => {
      const x = xFor(i);
      const y = yFor(c.close);
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }else{
    // K-line: lifeLine coloring when indicator on, else standard
    // Pre-compute EMA5 for cross detection
    let ema5 = null;
    const k5 = 2 / 6;
    candles.forEach((c, i) => {
      const x = xFor(i);
      ema5 = ema5 === null ? Number(c.close) : Number(c.close) * k5 + ema5 * (1 - k5);
      let color;
      if(state.showTongDaXin && c.lifeLine != null && c.ma20 != null){
        const cl = Number(c.close), ma20 = Number(c.ma20), ll = Number(c.lifeLine);
        const aboveMA20 = cl > ma20, belowMA20 = cl < ma20;
        const ema5AboveLL = ema5 > ll, ema5BelowLL = ema5 < ll;
        if((aboveMA20 && ema5BelowLL) || (belowMA20 && ema5AboveLL)){
          color = '#ffffff';
        }else if(cl > ll) color = '#00d109';
        else if(cl < ll) color = '#ff4d00';
        else color = '#ffffff';
      }else if(state.showTongDaXin && c.lifeLine != null){
        if(c.close > c.lifeLine) color = '#00d109';
        else if(c.close < c.lifeLine) color = '#ff4d00';
        else color = '#ffffff';
      }else{
        color = c.close >= c.open ? '#00d109' : '#ff4d00';
      }
      const yOpen = yFor(c.open), yClose = yFor(c.close), yHigh = yFor(c.high), yLow = yFor(c.low);
      const bodyTop = Math.min(yOpen, yClose);
      const bodyHeight = Math.max(1, Math.abs(yOpen - yClose));
      ctx.fillStyle = '#5e686f';
      ctx.fillRect(x - wickWidth / 2, yHigh, wickWidth, Math.max(1, yLow - yHigh));
      ctx.fillStyle = color;
      ctx.fillRect(x - bodyWidth / 2, bodyTop, bodyWidth, bodyHeight);
    });
    if(state.showTongDaXin) drawTongDaXin(candles, xFor, yFor, bodyWidth, wickWidth, top, priceBottom);
    if(state.showMa) MOVING_AVERAGES.forEach(ma => drawMovingAverage(ma, candles, xFor, yFor));
    if(state.showEma){
      drawIndicatorLine(candles, 'ema20', xFor, yFor, '#ffcc00', 0.9, 1.4);
      drawIndicatorLine(candles, 'ema50', xFor, yFor, '#ff6b6b', 0.8, 1.4);
    }
    if(state.showBollinger){
      drawIndicatorLine(candles, 'bbUpper', xFor, yFor, '#00bcd4', 0.65, 1.2);
      drawIndicatorLine(candles, 'bbMiddle', xFor, yFor, '#7b8794', 0.45, 1);
      drawIndicatorLine(candles, 'bbLower', xFor, yFor, '#00bcd4', 0.65, 1.2);
    }
  }
  if(state.showVolume) drawVolumePanel(candles, xFor, step, volumeTop, volumeBottom, maxVolume, height);
  if(state.showRsi) drawRsiPanel(candles, xFor, rsiTop, rsiBottom, width);
  if(state.showMacd) drawMacdPanel(candles, xFor, step, macdTop, macdBottom, width);

  if(state.hover >= state.start && state.hover < state.end){
    const local = state.hover - state.start;
    const c = state.candles[state.hover];
    const x = xFor(local);
    const y = state.hoverY === null ? yFor(c.close) : Math.max(top, Math.min(height - bottom, state.hoverY));
    ctx.strokeStyle = '#2962ff';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x, height - bottom);
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
    ctx.setLineDash([]);
    const hoverPrice = maxPrice - ((y - top) / Math.max(1, priceBottom - top)) * (maxPrice - minPrice);
    const priceText = fmt(hoverPrice);
    drawAxisLabel(priceText, width - 4, y, {
      align:'right',
      background:'#202735',
      border:'rgba(215,217,223,.18)',
      color:'#f3f4f6',
      maxRight:width - 4,
      maxTop:height - bottom - 22
    });
    const dateText = c.time;
    ctx.font = '12px Inter, Arial, sans-serif';
    const dateWidth = Math.ceil(ctx.measureText(dateText).width) + 18;
    drawAxisLabel(dateText, x - dateWidth / 2, height - bottom + 12, {
      background:'#202735',
      border:'rgba(215,217,223,.18)',
      color:'#f3f4f6',
      maxLeft:width - dateWidth - 4,
      maxTop:height - 24
    });
  }
  queueLayoutRedraw(width, height);
}

function nearestIndex(clientX){
  const rect = canvas.getBoundingClientRect();
  const padBox = chartPadding(rect.width);
  const left = padBox.left;
  const candles = visibleCandles();
  const step = plotWidthFor(rect.width) / Math.max(1, candles.length);
  const local = Math.max(0, Math.min(candles.length - 1, Math.floor((clientX - rect.left - left) / step)));
  return state.start + local;
}

function beginDrag(clientX){
  state.dragging = true;
  state.pinching = false;
  state.dragX = clientX;
  state.dragStart = state.start;
  state.dragEnd = state.end;
}

function updateDrag(clientX){
  if(!state.dragging) return;
  const rect = canvas.getBoundingClientRect();
  const count = state.dragEnd - state.dragStart;
  const step = plotWidthFor(rect.width) / Math.max(1, count);
  const shift = Math.round((state.dragX - clientX) / step);
  let start = state.dragStart + shift;
  start = Math.max(0, Math.min(state.candles.length - count, start));
  state.start = start;
  state.end = start + count;
}

function inspectTouch(clientX, clientY){
  state.dragging = false;
  state.pinching = false;
  state.hover = nearestIndex(clientX);
  state.hoverY = clientY === undefined ? null : clientY - canvas.getBoundingClientRect().top;
  updateHeaderForHover();
}

function clearTouchTimer(){
  if(state.touchTimer){
    clearTimeout(state.touchTimer);
    state.touchTimer = null;
  }
}

function beginTouchInspect(touch){
  clearTouchTimer();
  state.touchMode = 'pending';
  state.touchStartX = touch.clientX;
  state.touchStartY = touch.clientY;
  state.touchCurrentX = touch.clientX;
  state.touchCurrentY = touch.clientY;
  state.dragging = false;
  state.pinching = false;
  state.touchTimer = setTimeout(() => {
    state.touchTimer = null;
    if(state.touchMode !== 'pending') return;
    state.touchMode = 'inspect';
    inspectTouch(state.touchStartX, state.touchStartY);
    draw();
  }, TOUCH_INSPECT_DELAY);
}

function updateTouchInspect(touch){
  state.touchCurrentX = touch.clientX;
  state.touchCurrentY = touch.clientY;
  if(state.touchMode === 'stockSwipe'){
    return;
  }
  if(state.touchMode === 'indicatorSwipe'){
    if(shouldSwitchStockOnSwipe()) state.touchMode = 'stockSwipe';
    return;
  }
  if(state.touchMode === 'inspect'){
    inspectTouch(touch.clientX, touch.clientY);
    return;
  }
  if(state.touchMode === 'pan'){
    updateDrag(touch.clientX);
    state.hover = -1;
    state.hoverY = null;
    return;
  }
  if(state.touchMode !== 'pending') return;

  const dx = touch.clientX - state.touchStartX;
  const dy = touch.clientY - state.touchStartY;
  if(Math.hypot(dx, dy) < TOUCH_PAN_THRESHOLD) return;

  clearTouchTimer();
  if(isMobileViewport() && touchStartsInIndicatorRegion() && Math.abs(dx) > Math.abs(dy) * 1.35){
    state.touchMode = shouldSwitchStockOnSwipe() ? 'stockSwipe' : 'indicatorSwipe';
    state.dragging = false;
    state.hover = -1;
    state.hoverY = null;
    return;
  }
  state.touchMode = 'pan';
  state.hover = -1;
  state.hoverY = null;
  beginDrag(state.touchStartX);
  updateDrag(touch.clientX);
}

function endGesture(){
  clearTouchTimer();
  state.touchMode = 'idle';
  state.dragging = false;
  state.pinching = false;
}

function isMobileViewport(){
  return window.matchMedia('(max-width: 768px)').matches;
}

function touchStartsInIndicatorRegion(){
  const rect = canvas.getBoundingClientRect();
  const localY = state.touchStartY - rect.top;
  return localY >= chartRegions(rect.width, rect.height).indicatorTop;
}

function shouldSwitchStockOnSwipe(){
  if(!isMobileViewport() || state.touchMode === 'pinch' || state.pinching) return false;
  if(!touchStartsInIndicatorRegion()) return false;
  const dx = state.touchCurrentX - state.touchStartX;
  const dy = state.touchCurrentY - state.touchStartY;
  return Math.abs(dx) >= STOCK_SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.35;
}

function touchDistance(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.max(1, Math.hypot(dx, dy));
}

function touchMidX(touches){
  return (touches[0].clientX + touches[1].clientX) / 2;
}

function beginPinch(touches){
  clearTouchTimer();
  const rect = canvas.getBoundingClientRect();
  const padBox = chartPadding(rect.width);
  state.touchMode = 'pinch';
  state.pinching = true;
  state.dragging = false;
  state.pinchDistance = touchDistance(touches);
  state.pinchStart = state.start;
  state.pinchEnd = state.end;
  state.pinchRatio = Math.max(0, Math.min(1, (touchMidX(touches) - rect.left - padBox.left) / plotWidthFor(rect.width)));
}

function updatePinch(touches){
  if(!state.pinching || !state.candles.length) return;
  const total = state.candles.length;
  const startCount = state.pinchEnd - state.pinchStart;
  const scale = state.pinchDistance / touchDistance(touches);
  const next = Math.max(20, Math.min(total, Math.round(startCount * scale)));
  const center = state.pinchStart + startCount * state.pinchRatio;
  let start = Math.round(center - next * state.pinchRatio);
  start = Math.max(0, Math.min(total - next, start));
  state.start = start;
  state.end = start + next;
  state.hover = -1;
  state.hoverY = null;
}

canvas.addEventListener('mousemove', event => {
  if(state.dragging){
    updateDrag(event.clientX);
  }else{
    state.hover = nearestIndex(event.clientX);
    state.hoverY = event.clientY - canvas.getBoundingClientRect().top;
    updateHeaderForHover();
  }
  draw();
});

canvas.addEventListener('mouseleave', () => {
  state.hover = -1;
  state.hoverY = null;
  updateHeaderForHover();
  endGesture();
  draw();
});

document.addEventListener('mousemove', event => {
  if(event.target === canvas || state.hover < 0 || state.dragging) return;
  state.hover = -1;
  state.hoverY = null;
  updateHeaderForHover();
  draw();
});

canvas.addEventListener('mousedown', event => {
  beginDrag(event.clientX);
});

window.addEventListener('mouseup', endGesture);

canvas.addEventListener('touchstart', event => {
  if(event.touches.length === 1){
    beginTouchInspect(event.touches[0]);
  }else if(event.touches.length >= 2){
    beginPinch(event.touches);
  }
  draw();
  event.preventDefault();
}, { passive:false });

canvas.addEventListener('touchmove', event => {
  if(event.touches.length >= 2){
    updatePinch(event.touches);
  }else if(event.touches.length === 1){
    updateTouchInspect(event.touches[0]);
  }
  draw();
  event.preventDefault();
}, { passive:false });

canvas.addEventListener('touchend', event => {
  if(state.touchMode === 'stockSwipe' || shouldSwitchStockOnSwipe()){
    const dx = state.touchCurrentX - state.touchStartX;
    const offset = dx < 0 ? 1 : -1;
    endGesture();
    moveStock(offset);
    draw();
    event.preventDefault();
    return;
  }
  if(event.touches.length >= 2){
    beginPinch(event.touches);
  }else if(event.touches.length === 1){
    beginTouchInspect(event.touches[0]);
  }else{
    endGesture();
  }
  draw();
  event.preventDefault();
}, { passive:false });

canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const total = state.candles.length;
  const current = state.end - state.start;
  const rect = canvas.getBoundingClientRect();
  const padBox = chartPadding(rect.width);
  const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left - padBox.left) / plotWidthFor(rect.width)));
  const center = state.start + current * ratio;
  const next = Math.max(20, Math.min(total, Math.round(current * (event.deltaY > 0 ? 1.18 : 0.84))));
  let start = Math.round(center - next * ratio);
  start = Math.max(0, Math.min(total - next, start));
  state.start = start;
  state.end = start + next;
  draw();
}, { passive:false });

document.getElementById('ranges').addEventListener('click', event => {
  const button = event.target.closest('button[data-range]');
  if(!button) return;
  setRange(button.dataset.range);
});

maToggle.addEventListener('click', () => {
  state.maCollapsed = !state.maCollapsed;
  draw();
});

indicatorTrigger.addEventListener('click', event => {
  event.stopPropagation();
  const open = indicatorControl.classList.toggle('open');
  indicatorTrigger.setAttribute('aria-expanded', String(open));
});
document.getElementById('indicatorMenu').addEventListener('change', event => {
  const input = event.target.closest('input[data-indicator]');
  if(!input) return;
  state[input.dataset.indicator] = input.checked;
  draw();
});
// Sync checkbox state with URL params (e.g. ?td=1&ma=0)
document.querySelectorAll('#indicatorMenu input[data-indicator]').forEach(input => {
  const key = input.dataset.indicator;
  if(key in state) input.checked = !!state[key];
});
document.addEventListener('click', event => {
  if(indicatorControl.contains(event.target)) return;
  indicatorControl.classList.remove('open');
  indicatorTrigger.setAttribute('aria-expanded', 'false');
});

function setupNavSearch(){
  const form = document.querySelector('.nav-search');
  if(!form) return;
  const input = form.querySelector('input[name="q"]');
  const results = document.createElement('div');
  results.className = 'nav-search-results';
  form.appendChild(results);
  let rowsCache = null;
  let activeIndex = -1;
  let currentMatches = [];
  const stockUrl = row => {
    const root = form.dataset.root || '';
    const params = new URLSearchParams();
    params.set('symbol', row.symbol);
    params.set('name', row.name || row.symbol);
    return root + 'stock_chart.html?' + params.toString();
  };
  const loadRows = async () => {
    if(rowsCache) return rowsCache;
    const root = form.dataset.root || '';
    try{
      const response = await fetch(root + 'market_data/index.json', { cache:'no-store' });
      if(!response.ok) throw new Error('No market index');
      const index = await response.json();
      const groups = index.groups || {};
      const source = Object.keys(groups).length
        ? Object.values(groups).flatMap(group => group.stocks || [])
        : (index.stocks || []);
      const seen = new Set();
      rowsCache = source.map(row => ({
        symbol: String(row.symbol || '').toUpperCase(),
        name: row.name || row.symbol || '',
        d: Number(row.d || 0)
      })).filter(row => {
        if(!row.symbol || seen.has(row.symbol)) return false;
        seen.add(row.symbol);
        return true;
      });
    }catch(error){
      rowsCache = [];
    }
    return rowsCache;
  };
  const compactSearchText = value => String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const searchScore = (row, query, compactQuery) => {
    const symbol = String(row.symbol || '');
    const symbolLower = symbol.toLowerCase();
    const nameLower = String(row.name || '').toLowerCase();
    const compactSymbol = compactSearchText(symbol);
    const compactName = compactSearchText(row.name || '');
    if(symbolLower === query) return 0;
    if(compactQuery && compactSymbol === compactQuery) return 1;
    if(symbolLower.startsWith(query)) return 2;
    if(compactQuery && compactSymbol.startsWith(compactQuery)) return 3;
    if(nameLower.includes(query)) return 4;
    if(compactQuery && compactName.includes(compactQuery)) return 5;
    return 99;
  };
  const closeResults = () => {
    results.classList.remove('open');
    results.innerHTML = '';
    activeIndex = -1;
    currentMatches = [];
  };
  const paintResults = () => {
    if(!currentMatches.length){ closeResults(); return; }
    results.innerHTML = currentMatches.map((row,index) => {
      const cls = row.d >= 0 ? 'up' : 'down';
      const sign = row.d > 0 ? '+' : '';
      return '<button class="nav-result'+(index === activeIndex ? ' active' : '')+'" type="button" data-index="'+index+'">' +
        '<span class="nav-result-symbol">'+row.symbol+'</span>' +
        '<span class="nav-result-name">'+row.name+'</span>' +
        '<span class="nav-result-change '+cls+'">'+sign+row.d.toFixed(2)+'%</span>' +
        '</button>';
    }).join('');
    results.classList.add('open');
  };
  const updateResults = async () => {
    const queryRaw = (input.value || '').trim();
    const query = queryRaw.toLowerCase();
    if(!query){ closeResults(); return; }
    const compactQuery = compactSearchText(queryRaw);
    const rows = await loadRows();
    currentMatches = rows
      .map(row => ({ row, score: searchScore(row, query, compactQuery) }))
      .filter(item => item.score < 99)
      .sort((a,b) => a.score - b.score || a.row.symbol.localeCompare(b.row.symbol))
      .slice(0, 20)
      .map(item => item.row);
    activeIndex = currentMatches.length ? Math.max(0, Math.min(activeIndex, currentMatches.length - 1)) : -1;
    paintResults();
  };
  const runSearch = async () => {
    if(currentMatches.length){
      const row = currentMatches[Math.max(0, activeIndex)];
      window.location.href = stockUrl(row);
      return;
    }
    const query = (input.value || '').trim();
    if(!query) return;
    window.location.href = stockUrl({ symbol: query.toUpperCase(), name: query });
  };
  form.addEventListener('submit', event => {
    event.preventDefault();
    runSearch();
  });
  input.addEventListener('keydown', async event => {
    if(event.key === 'ArrowDown' && currentMatches.length){
      event.preventDefault();
      activeIndex = Math.min(currentMatches.length - 1, activeIndex + 1);
      paintResults();
      return;
    }
    if(event.key === 'ArrowUp' && currentMatches.length){
      event.preventDefault();
      activeIndex = Math.max(0, activeIndex - 1);
      paintResults();
      return;
    }
    if(event.key === 'Escape'){ closeResults(); return; }
    if(event.key !== 'Enter') return;
    event.preventDefault();
    runSearch();
  });
  input.addEventListener('input', updateResults);
  input.addEventListener('focus', updateResults);
  results.addEventListener('mousedown', event => {
    const button = event.target.closest('.nav-result');
    if(!button) return;
    event.preventDefault();
    const row = currentMatches[Number(button.dataset.index)];
    if(row) window.location.href = stockUrl(row);
  });
  document.addEventListener('click', event => {
    if(!form.contains(event.target)) closeResults();
  });
}

function rowSymbol(row){ return (row.symbol || row.t || '').toUpperCase(); }
function rowName(row){ return row.name || row.n || rowSymbol(row); }
function rowSector(row){ return row.sector || row.s || 'Sector'; }
function rowMarketCap(row){ return row.marketCap || row.c || 'Market cap'; }
function rowPrice(row){ return Number(row.price ?? row.p ?? 0); }
function rowMarketCapNum(row){ return Number(row.marketCapNum ?? row.mn ?? 0); }
function rowRank(row){ return Number(row.rank ?? row.r ?? 9999); }
function rowMetric(row){ return Number(row[state.metric] ?? 0); }

function groupEntries(){
  const groups = state.marketIndex && state.marketIndex.groups ? state.marketIndex.groups : {};
  const entries = Object.keys(groups).map(key => ({ key, label: groups[key].label || UNIVERSE_LABELS[key] || key }));
  if(entries.length) entries.push({ key:'all', label:'All Stocks' });
  return entries.length ? entries : [{ key:'all', label:'All Stocks' }];
}

function getBaseRows(){
  const index = state.marketIndex || {};
  const groups = index.groups || {};
  if(state.universe !== 'all' && groups[state.universe] && groups[state.universe].stocks){
    return groups[state.universe].stocks;
  }
  const source = Object.keys(groups).length
    ? Object.values(groups).flatMap(group => group.stocks || [])
    : (index.stocks || []);
  const seen = new Set();
  return source.filter(row => {
    const symbol = rowSymbol(row);
    if(!symbol || seen.has(symbol)) return false;
    seen.add(symbol);
    return true;
  });
}

function getSortValue(row){
  if(state.sortKey === 'gain') return rowMetric(row);
  if(state.sortKey === 'rank') return rowRank(row);
  if(state.sortKey === 'price') return rowPrice(row);
  if(state.sortKey === 'marketCapNum') return rowMarketCapNum(row);
  return rowSymbol(row);
}

function sortedRows(){
  let rows = getBaseRows();
  rows = rows.slice().sort((a,b) => {
    const av = getSortValue(a);
    const bv = getSortValue(b);
    if(typeof av === 'string' || typeof bv === 'string'){
      return state.sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    }
    return state.sortDir === 'asc' ? av - bv : bv - av;
  });
  return rows;
}

function valueLabel(row){
  if(state.sortKey === 'gain') return fmtPct(rowMetric(row));
  if(state.sortKey === 'rank') return '#' + rowRank(row);
  if(state.sortKey === 'price') return fmt(rowPrice(row));
  if(state.sortKey === 'marketCapNum') return rowMarketCap(row);
  return rowSymbol(row);
}

function syncControls(){
  const entries = groupEntries();
  if(!entries.some(entry => entry.key === state.universe)) state.universe = entries[0].key;
  universeSelect.innerHTML = entries.map(entry => '<option value="'+entry.key+'">'+entry.label+'</option>').join('');
  universeSelect.value = state.universe;
  sortSelect.value = state.sortKey;
  mobileSortSelect.value = state.sortKey;
  metricSelect.value = state.metric;
  directionSelect.value = state.sortDir;
  const universeLabel = entries.find(entry => entry.key === state.universe)?.label || UNIVERSE_LABELS[state.universe] || state.universe;
  filterSummary.textContent = [universeLabel, SORT_LABELS[state.sortKey], METRIC_LABELS[state.metric], DIRECTION_LABELS[state.sortDir]].filter(Boolean).join(' · ');
}

function renderStockList(){
  syncControls();
  state.stockRows = sortedRows();
  stockRowDataBySymbol.clear();
  stockButtonBySymbol.clear();
  activeStockButton = null;
  stockListEl.innerHTML = state.stockRows.map((row, index) => {
    const symbol = rowSymbol(row);
    stockRowDataBySymbol.set(symbol, row);
    const active = symbol === currentSymbol ? ' active' : '';
    const metric = rowMetric(row);
    const valueClass = metric >= 0 ? ' up' : ' down';
    return '<button class="stock-row'+active+valueClass+'" data-symbol="'+symbol+'" type="button">' +
      '<span class="stock-rank">'+(index + 1)+'</span>' +
      '<span class="stock-main"><span class="stock-symbol">'+symbol+'</span></span>' +
      '<span class="stock-value'+valueClass+'">'+fmtPct(metric)+'</span>' +
      '</button>';
  }).join('');
  stockListEl.querySelectorAll('.stock-row[data-symbol]').forEach(button => {
    stockButtonBySymbol.set(button.dataset.symbol, button);
  });
  markActiveStockRow(true);
}

function markActiveStockRow(scroll=false){
  if(activeStockButton){
    activeStockButton.classList.remove('active');
    activeStockButton = null;
  }
  if(!currentSymbol) return;
  const active = stockButtonBySymbol.get(currentSymbol);
  if(active){
    active.classList.add('active');
    activeStockButton = active;
    if(scroll) active.scrollIntoView({ block:'nearest' });
  }
}

function currentRow(){
  return stockRowDataBySymbol.get(currentSymbol);
}

function updateUrl(row){
  const next = new URLSearchParams();
  next.set('symbol', currentSymbol);
  next.set('name', rowName(row || currentRow() || { symbol: currentSymbol, name: fallbackName }));
  next.set('universe', state.universe);
  next.set('metric', state.metric);
  next.set('sort', state.sortKey);
  next.set('dir', state.sortDir);
  window.history.replaceState(null, '', window.location.pathname + '?' + next.toString());
}

async function switchStock(symbol){
  symbol = String(symbol || '').toUpperCase();
  if(!symbol || symbol === currentSymbol) return;
  const row = stockRowDataBySymbol.get(symbol);
  currentSymbol = symbol;
  fallbackName = row ? rowName(row) : symbol;
  if(window.matchMedia('(max-width: 768px)').matches){
    stockPanel.classList.remove('open');
    markActiveStockRow(false);
  }else{
    markActiveStockRow(true);
  }
  renderHeaderFromRow(row);
  updateUrl(row);
  requestAnimationFrame(() => loadChart());
}

function moveStock(offset){
  if(!state.stockRows.length) return;
  let index = state.stockRows.findIndex(row => rowSymbol(row) === currentSymbol);
  if(index < 0) index = 0;
  const next = Math.max(0, Math.min(state.stockRows.length - 1, index + offset));
  switchStock(rowSymbol(state.stockRows[next]));
}

function setupKeyboardStockSwitching(){
  window.addEventListener('keydown', event => {
    if(window.matchMedia('(max-width: 768px)').matches) return;
    if(event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    if(event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
    const direction = ({ ArrowLeft:-1, ArrowUp:-1, ArrowRight:1, ArrowDown:1 })[event.key];
    if(!direction) return;
    event.preventDefault();
    moveStock(direction);
  });
}

function setupStockControls(){
  document.getElementById('panelToggle').addEventListener('click', () => {
    if(window.matchMedia('(max-width: 768px)').matches){
      stockPanel.classList.toggle('open');
    }else{
      pageLayout.classList.toggle('sidebar-collapsed');
      document.getElementById('panelToggle').textContent = pageLayout.classList.contains('sidebar-collapsed') ? '›' : '‹';
      setTimeout(resizeCanvas, 80);
    }
  });
  document.getElementById('mobileListToggle').addEventListener('click', () => stockPanel.classList.toggle('open'));
  stockListEl.addEventListener('pointerdown', event => {
    const button = event.target.closest('.stock-row[data-symbol]');
    if(!button) return;
    if(event.pointerType === 'mouse') return;
    event.preventDefault();
    switchStock(button.dataset.symbol);
  });
  stockListEl.addEventListener('click', event => {
    const button = event.target.closest('.stock-row[data-symbol]');
    if(!button) return;
    switchStock(button.dataset.symbol);
  });
  universeSelect.addEventListener('change', () => { state.universe = universeSelect.value; renderStockList(); updateUrl(currentRow()); });
  sortSelect.addEventListener('change', () => { state.sortKey = normalizeSortKey(sortSelect.value); renderStockList(); updateUrl(currentRow()); });
  mobileSortSelect.addEventListener('change', () => { state.sortKey = normalizeSortKey(mobileSortSelect.value); renderStockList(); updateUrl(currentRow()); });
  metricSelect.addEventListener('change', () => { state.metric = metricSelect.value; renderStockList(); updateUrl(currentRow()); });
  directionSelect.addEventListener('change', () => { state.sortDir = directionSelect.value === 'asc' ? 'asc' : 'desc'; renderStockList(); updateUrl(currentRow()); });
  setupKeyboardStockSwitching();
}

async function loadMarketIndex(){
  try{
    let data;
    if(params.get('list') === 'crossover'){
      const response = await fetch('crossover_data.json', { cache:'no-store' });
      if(!response.ok) throw new Error('No crossover data');
      const cd = await response.json();
      data = { stocks: (cd.stocks || []).map(s => ({
        symbol: s.symbol, name: s.name, price: s.price, d: s.change_pct, sector: ''
      })) };
    }else{
      const response = await fetch('market_data/index.json', { cache:'no-store' });
      if(!response.ok) throw new Error('No market index');
      data = await response.json();
    }
    state.marketIndex = data;
  }catch(error){
    state.marketIndex = { stocks: currentSymbol ? [{ symbol: currentSymbol, name: fallbackName }] : [] };
  }
  setupStockControls();
  renderStockList();
}

async function loadChart(){
  if(!currentSymbol){
    setStatus('Missing stock symbol.');
    return;
  }
  const requestId = ++activeChartRequest;
  const symbol = currentSymbol;
  try{
    let data = chartCache.get(symbol);
    if(!data){
      setStatus('Loading price data...');
      const response = await fetch('market_data/' + encodeURIComponent(symbol) + '.json', { cache:'no-store' });
      if(!response.ok) throw new Error('No chart data found for ' + symbol);
      data = await response.json();
      if(chartCache.size > 24) chartCache.delete(chartCache.keys().next().value);
      chartCache.set(symbol, data);
    }
    if(requestId !== activeChartRequest || symbol !== currentSymbol) return;
    if(!data.prices || !data.prices.length) throw new Error('Chart data is empty for ' + symbol);
    currentSymbol = data.symbol;
    fallbackName = data.name || fallbackName || currentSymbol;
    state.candles = data.prices;
    calculateMovingAverages(state.candles);
    calculateMacd(state.candles);
    calculateTechnicalIndicators(state.candles);
    calculateTDSequential(state.candles);
    calculateLifeLine(state.candles);
    renderHeader(data);
    setStatus('');
    setRange(state.activeRange || defaultChartRange());
  }catch(error){
    if(requestId !== activeChartRequest || symbol !== currentSymbol) return;
    if(String(error.message || '').includes('No chart data found')){
      setStatusHtml(
        '<span class="status-title">' + currentSymbol + ' chart history is not generated yet.</span>' +
        '<span>This symbol is tracked in the full US stock universe, but its historical chart JSON has not been backfilled yet.</span>'
      );
    }else{
      setStatus(error.message || 'Unable to load chart data.');
    }
  }
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
setupNavSearch();
loadMarketIndex();
loadChart();
</script>
