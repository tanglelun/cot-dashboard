<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bond Yield Chart</title>
<link rel="stylesheet" href="nav_market.css">
<style>
:root{--bg:#000;--panel:#050709;--panel2:#090d12;--line:#1d2730;--line2:#202932;--text:#d1d4dc;--muted:#787b86;--green:#00d109;--red:#ff4d00;--blue:#2962ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;font-weight:760}
.site-nav{min-height:64px;display:flex;align-items:center;gap:28px;padding:0 24px;background:#000;border-bottom:1px solid #1b1f2a;position:relative;z-index:30}
.site-brand{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:25px;font-weight:900}
.brand-mark{position:relative;width:22px;height:26px;display:inline-block}
.brand-mark::before{content:"";position:absolute;left:7px;top:1px;width:10px;height:24px;background:#fff;border-radius:10px 10px 10px 1px;transform:skew(-18deg) rotate(22deg);transform-origin:center}
.brand-mark::after{content:"";position:absolute;left:2px;bottom:2px;width:13px;height:3px;background:#fff;border-radius:999px;transform:rotate(-34deg)}
.nav-check{position:absolute;opacity:0;pointer-events:none}
.nav-toggle{display:none;width:38px;height:38px;border:1px solid #2a2e39;border-radius:999px;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;margin-left:0}
.nav-toggle span{width:16px;height:2px;background:#fff;border-radius:999px}
.nav-links{display:flex;align-items:center;gap:28px;flex:0 1 auto}
.nav-link{position:relative;color:#f3f4f6;font-size:15px;font-weight:850;text-decoration:none;white-space:nowrap}
.nav-link:hover,.nav-link.active{color:#b8ff00}
.nav-market{position:relative;display:flex;align-items:center}
.market-trigger{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;font:inherit}
.market-trigger::after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px)}
.market-menu{position:absolute;left:50%;top:100%;margin-top:8px;min-width:190px;padding:8px;border:1px solid #26313d;border-radius:8px;background:rgba(9,13,18,.96);box-shadow:0 18px 48px rgba(0,0,0,.48);transform:translateX(-50%) translateY(6px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .14s,transform .14s,visibility .14s;z-index:50}
.market-menu::before{content:"";position:absolute;left:0;right:0;top:-15px;height:15px}
.nav-market:hover .market-menu,.nav-market:focus-within .market-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.market-menu-link{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:5px;color:var(--text);font-size:13px;font-weight:850;text-decoration:none}
.market-menu-link:hover,.market-menu-link.active{background:rgba(0,209,9,.16);color:#fff}
.nav-search-icon{width:42px;height:42px;border:1px solid #2a2e39;border-radius:999px;background:#090c12;display:inline-flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;margin-left:auto;text-decoration:none}
.nav-search-icon::before{content:"";width:13px;height:13px;border:2px solid #d1d4dc;border-radius:50%}
.nav-search-icon::after{content:"";position:absolute;width:7px;height:2px;background:#d1d4dc;border-radius:999px;transform:translate(9px,9px) rotate(45deg)}
.page-layout{display:grid;grid-template-columns:clamp(220px,14vw,270px) minmax(0,1fr);gap:10px;padding:10px;min-height:calc(100vh - 74px)}
.sidebar{background:var(--panel);border:1px solid var(--line2);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line2)}
.sidebar-title{font-size:17px;font-weight:900;color:#fff}
.sidebar-body{flex:1;overflow:auto;padding:8px 6px}
.bond-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-height:38px;padding:0 8px;margin-bottom:3px;border-radius:6px;background:transparent;border:0;color:#d7dae2;cursor:pointer;text-align:left;width:100%;font:inherit}
.bond-row:hover{background:#0d171f}
.bond-row.active{background:rgba(0,209,9,.14)}
.bond-name{font-size:13px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bond-yield{font-size:13px;font-weight:850;text-align:right}
.bond-yield.up{color:var(--green)}.bond-yield.down{color:var(--red)}
.main-panel{min-width:0;display:flex;flex-direction:column;gap:10px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 12px;background:#000;border:1px solid var(--line2);border-radius:8px}
.header h1{margin:0;color:#fff;font-size:22px;font-weight:950}
.header .sub{color:var(--muted);font-size:12px;margin-top:2px}
.yield-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:2px solid var(--green);border-radius:999px;color:#fff;font-size:18px;font-weight:950}
.day-change{font-size:12px;font-weight:850}
.day-change.up{color:var(--green)}.day-change.down{color:var(--red)}
.range-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.range-tab{height:30px;border:1px solid var(--line2);background:#000;color:var(--muted);border-radius:5px;padding:0 10px;font:900 12px Inter,Arial,sans-serif;cursor:pointer}
.range-tab:hover{background:#101820;color:#fff}
.range-tab.active{background:var(--green);border-color:var(--green);color:#001b03}
.chart-wrap{position:relative;flex:1;min-height:440px;border:1px solid var(--line2);background:#000;border-radius:4px}
canvas{display:block;width:100%;height:100%}
.tooltip{position:absolute;left:0;top:0;display:none;min-width:120px;padding:8px 10px;border:1px solid var(--line2);border-radius:5px;background:rgba(9,13,18,.96);color:#fff;font-size:12px;font-weight:850;pointer-events:none;z-index:5}
.tooltip .muted{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
@media(max-width:720px){
  .site-nav{min-height:58px;padding:10px 14px;gap:10px;flex-wrap:wrap}
  .site-brand{font-size:21px}.nav-toggle{display:flex}
  .nav-links{display:none;flex:0 0 100%;width:100%;flex-direction:column;align-items:stretch;gap:4px;padding-top:8px}
  .nav-check:checked~.nav-links{display:flex}
  .nav-link{height:40px;display:flex;align-items:center;font-size:14px}
  .nav-market{display:block}.market-menu{position:static;opacity:1;visibility:visible;pointer-events:auto;transform:none;box-shadow:none;background:transparent;border:0;padding:0 0 0 12px}.market-menu::before{display:none}
  .page-layout{display:block}.sidebar{display:none}
  .header h1{font-size:19px}.chart-wrap{min-height:380px}
}
</style>
</head>
<body>
<nav class="site-nav" aria-label="Primary">
  <a class="site-brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span>Net Data</span></a>
  <input class="nav-check" type="checkbox" id="navMenu">
  <label class="nav-toggle" for="navMenu"><span></span><span></span><span></span></label>
  <div class="nav-links">
    <a class="nav-link" href="cot_noncommercial_history.html">Commercial</a>
    <div class="nav-market">
      <button class="nav-link market-trigger" type="button">Market</button>
      <div class="market-menu">
        <a class="market-menu-link" href="russell2000_top100.html?market=stock">Tops</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=commodities">Commodities</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=indexes">Indexes</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=shares">Stock</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=currencies">Currencies</a>
        <a class="market-menu-link" href="russell2000_top100.html?market=crypto">Crypto</a>
        <a class="market-menu-link active" href="russell2000_top100.html?market=bonds">Bonds</a>
      </div>
    </div>
    <a class="nav-link" href="economy.html">Indicators</a>
    <a class="nav-link" href="market_pulse.html">Insight</a>
    <a class="nav-link" href="compare.html">Compare</a>
    <a class="nav-link" href="calendar.html">Calendar</a>
  </div>
  <a class="nav-search-icon" href="search.html" aria-label="Search"></a>
</nav>
<main class="page-layout">
  <aside class="sidebar">
    <div class="sidebar-head"><span class="sidebar-title">Bonds</span></div>
    <div class="sidebar-body" id="bondList"></div>
  </aside>
  <div class="main-panel">
    <div class="header">
      <div>
        <h1 id="bondName">--</h1>
        <div class="sub" id="bondMeta">Loading...</div>
      </div>
      <div class="yield-badge"><span id="bondYield">--</span><span class="day-change" id="bondDay"></span></div>
    </div>
    <div class="range-tabs" id="rangeTabs">
      <button class="range-tab" data-range="all">All</button>
      <button class="range-tab" data-range="10y">10y</button>
      <button class="range-tab active" data-range="5y">5y</button>
      <button class="range-tab" data-range="2y">2y</button>
      <button class="range-tab" data-range="1y">1y</button>
      <button class="range-tab" data-range="ytd">YTD</button>
      <button class="range-tab" data-range="6m">6m</button>
    </div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>
</main>
<script>
(function(){
var state={bonds:[],current:'',points:[],range:'5y',data:null};
var $=function(id){return document.getElementById(id);};
var fmt=function(v){return v==null||!Number.isFinite(v)?'--':Number(v).toFixed(2)+'%';};
var fmtPct=function(v){if(v==null||!Number.isFinite(v))return'--';var s=v>=0?'+':'';return s+v.toFixed(3)+'%';};
var dateMs=function(d){return new Date(d).getTime();};
var canvas=$('chart'),ctx=canvas.getContext('2d');

function loadIndex(){
  fetch('bonds_data.json')
    .then(function(r){return r.json();})
    .then(function(data){
      state.bonds=data.bonds||[];
      state.data=data;
      renderSidebar();
      var params=new URLSearchParams(window.location.search);
      var sid=params.get('series_id')||'';
      if(!sid&&state.bonds.length) sid=state.bonds[0].series_id;
      switchBond(sid);
    });
}

function renderSidebar(){
  var html='';
  var groups={Treasury:[],TIPS:[]};
  state.bonds.forEach(function(b){
    var cat=b.category==='TIPS'?'TIPS':'Treasury';
    groups[cat].push(b);
  });
  ['Treasury','TIPS'].forEach(function(cat){
    if(!groups[cat].length)return;
    html+='<div style="color:var(--muted);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.05em;padding:8px 8px 4px">'+cat+'</div>';
    groups[cat].forEach(function(b){
      var active=b.series_id===state.current?' active':'';
      var d=b.day||0, cls=d>=0?'up':'down';
      html+='<button class="bond-row'+active+'" data-sid="'+b.series_id+'" type="button">'+
        '<span class="bond-name">'+b.name+'</span>'+
        '<span class="bond-yield '+cls+'">'+fmt(b.yield)+'</span>'+
        '</button>';
    });
  });
  $('bondList').innerHTML=html;
}

$('bondList').addEventListener('click',function(e){
  var btn=e.target.closest('.bond-row[data-sid]');
  if(!btn)return;
  switchBond(btn.dataset.sid);
});

function switchBond(sid){
  state.current=sid;
  var bond=state.bonds.find(function(b){return b.series_id===sid;});
  if(!bond)return;
  $('bondName').textContent=bond.name;
  $('bondYield').textContent=fmt(bond.yield);
  var d=bond.day||0, dCls=d>=0?'up':'down';
  $('bondDay').textContent=fmtPct(bond.day);
  $('bondDay').className='day-change '+dCls;
  $('bondMeta').textContent=(state.data.updated||'')+' · '+(bond.date||'')+' · FRED';
  renderSidebar();
  loadChart(sid);
}

function loadChart(sid){
  fetch('bonds_data/'+encodeURIComponent(sid)+'.json')
    .then(function(r){if(!r.ok)throw new Error('Not found');return r.json();})
    .then(function(data){
      state.points=(data.points||[]).filter(function(p){return Number.isFinite(p.value);});
      render();
    });
}

$('rangeTabs').addEventListener('click',function(e){
  var btn=e.target.closest('button[data-range]');
  if(!btn)return;
  state.range=btn.dataset.range;
  document.querySelectorAll('.range-tab').forEach(function(t){t.classList.toggle('active',t===btn);});
  render();
});

function filterPoints(){
  var pts=state.points;
  if(!pts.length||state.range==='all')return pts;
  var last=new Date(pts[pts.length-1].date);
  var start=new Date(last);
  if(state.range==='6m')start.setMonth(start.getMonth()-6);
  if(state.range==='1y')start.setFullYear(start.getFullYear()-1);
  if(state.range==='2y')start.setFullYear(start.getFullYear()-2);
  if(state.range==='5y')start.setFullYear(start.getFullYear()-5);
  if(state.range==='10y')start.setFullYear(start.getFullYear()-10);
  if(state.range==='ytd')return pts.filter(function(p){return p.date>=last.getFullYear()+'-01-01';});
  var ms=start.getTime();
  return pts.filter(function(p){return dateMs(p.date)>=ms;});
}

function render(){
  var pts=filterPoints();
  if(!pts.length)return;
  var rect=canvas.parentElement.getBoundingClientRect();
  var w=rect.width,h=rect.height,dpr=window.devicePixelRatio||1;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);

  var p={top:28,right:20,bottom:32,left:72};
  var cw=w-p.left-p.right,ch=h-p.top-p.bottom;
  var vals=pts.map(function(p){return p.value;});
  var minY=Math.min.apply(null,vals),maxY=Math.max.apply(null,vals);
  var ry=maxY-minY||1;minY-=ry*0.12;maxY+=ry*0.12;
  var minX=dateMs(pts[0].date),maxX=dateMs(pts[pts.length-1].date),rx=maxX-minX||1;

  function xf(d){return p.left+((dateMs(d)-minX)/rx)*cw;}
  function yf(v){return p.top+ch-((v-minY)/(maxY-minY))*ch;}

  ctx.clearRect(0,0,w,h);

  // grid
  ctx.strokeStyle='#1d2730';ctx.lineWidth=1;
  ctx.fillStyle='#787b86';ctx.font='11px Inter,Arial';ctx.textAlign='right';
  for(var i=0;i<=5;i++){
    var yv=minY+ry*1.12*i/5,yp=yf(yv);
    ctx.beginPath();ctx.moveTo(p.left,yp);ctx.lineTo(w-p.right,yp);ctx.stroke();
    ctx.fillText(yv.toFixed(2)+'%',p.left-8,yp+4);
  }

  // x labels
  var days=(maxX-minX)/86400000,step=days<180?30:days<730?90:days<1825?180:365;
  ctx.textAlign='center';
  for(var d=new Date(pts[0].date);d.getTime()<=maxX;d.setDate(d.getDate()+step)){
    ctx.fillText(d.toISOString().slice(0,10),xf(d.toISOString().slice(0,10)),h-p.bottom+18);
  }

  // fill
  ctx.beginPath();
  for(var j=0;j<pts.length;j++){var xj=xf(pts[j].date),yj=yf(pts[j].value);j===0?ctx.moveTo(xj,yj):ctx.lineTo(xj,yj);}
  ctx.lineTo(xf(pts[pts.length-1].date),p.top+ch);ctx.lineTo(xf(pts[0].date),p.top+ch);ctx.closePath();
  var g=ctx.createLinearGradient(0,p.top,0,p.top+ch);
  g.addColorStop(0,'rgba(41,98,255,0.22)');g.addColorStop(1,'rgba(41,98,255,0.02)');
  ctx.fillStyle=g;ctx.fill();

  // line
  ctx.beginPath();ctx.strokeStyle='#2962ff';ctx.lineWidth=2;ctx.lineJoin='round';
  for(var k=0;k<pts.length;k++){var xk=xf(pts[k].date),yk=yf(pts[k].value);k===0?ctx.moveTo(xk,yk):ctx.lineTo(xk,yk);}
  ctx.stroke();

  // axes
  ctx.strokeStyle='#1d2730';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(p.left,p.top);ctx.lineTo(p.left,p.top+ch);ctx.stroke();
  ctx.beginPath();ctx.moveTo(p.left,p.top+ch);ctx.lineTo(w-p.right,p.top+ch);ctx.stroke();

  // hover
  var tip=$('tooltip');
  canvas.onmousemove=function(e){
    var mx=e.clientX-rect.left;
    if(mx<p.left||mx>w-p.right){tip.style.display='none';return;}
    var t=minX+((mx-p.left)/cw)*rx,best=pts[0],bd=Infinity;
    for(var i2=0;i2<pts.length;i2++){var di=Math.abs(dateMs(pts[i2].date)-t);if(di<bd){bd=di;best=pts[i2];}}
    tip.innerHTML='<span class="muted">'+best.date+'</span>Yield <strong>'+fmt(best.value)+'</strong>';
    var lx=Math.min(w-136,Math.max(8,xf(best.date)+12));
    tip.style.transform='translate('+lx+'px, 8px)';
    tip.style.display='block';
  };
  canvas.onmouseleave=function(){tip.style.display='none';};
}

window.addEventListener('resize',function(){if(state.points.length)render();});
loadIndex();
})();
</script>
</body>
</html>
