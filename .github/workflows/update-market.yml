name: Update Market data

on:
  workflow_dispatch:
  schedule:
    # Runs after the regular US market close.
    # 22:30 UTC = 06:30 Beijing time on the next day.
    - cron: "30 22 * * 1-5"
    # Retry after the provider has had more time to publish the daily close.
    # 04:30 UTC = 12:30 Beijing time, Tuesday through Saturday.
    - cron: "30 4 * * 2-6"

concurrency:
  group: update-market
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update Market page
        id: stocks
        continue-on-error: true
        run: python -u update_market.py

      - name: Update Commodities data
        id: commodities
        continue-on-error: true
        run: python update_commodities.py

      - name: Update Indexes data
        id: indexes
        continue-on-error: true
        run: python update_indexes.py

      - name: Generate Crossover signals
        id: crossover
        if: steps.stocks.outcome == 'success'
        continue-on-error: true
        run: python generate_crossover.py

      - name: Select successful outputs
        id: outputs
        env:
          STOCKS_OK: ${{ steps.stocks.outcome }}
          COMMODITIES_OK: ${{ steps.commodities.outcome }}
          INDEXES_OK: ${{ steps.indexes.outcome }}
          CROSSOVER_OK: ${{ steps.crossover.outcome }}
        run: |
          patterns=()
          if [[ "$STOCKS_OK" == success ]]; then patterns+=("russell2000_top100.html" "market_data/*.json"); fi
          if [[ "$COMMODITIES_OK" == success ]]; then patterns+=("commodities_data.json" "commodities_data/*.json"); fi
          if [[ "$INDEXES_OK" == success ]]; then patterns+=("indexes_data.json" "indexes_data/*.json"); fi
          if [[ "$CROSSOVER_OK" == success ]]; then patterns+=("crossover_data.json"); fi
          echo "files=${patterns[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit updated Market page
        if: steps.outputs.outputs.files != ''
        uses: stefanzweifel/git-auto-commit-action@v5
        id: commit
        with:
          skip_push: true
          commit_message: "Update Market data"
          file_pattern: ${{ steps.outputs.outputs.files }}

      - name: Publish after syncing concurrent commits
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Report incomplete refreshes
        if: steps.stocks.outcome == 'failure' || steps.commodities.outcome == 'failure' || steps.indexes.outcome == 'failure' || steps.crossover.outcome == 'failure'
        run: |
          echo "::error::One or more data sources failed. Successful updates were committed; inspect the failed step."
          exit 1
