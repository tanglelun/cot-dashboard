name: Update COT data

on:
  workflow_dispatch:
  schedule:
    # After US afternoon releases, including holiday-delayed Monday releases.
    # Recheck daily so a delayed publication does not wait until next Saturday.
    - cron: "30 2,14 * * *"

concurrency:
  group: update-cot-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update COT history
        run: python cot_historical.py

      - name: Update futures prices
        run: python fetch_prices.py

      - name: Generate HTML
        run: python generate_history_html.py

      - name: Commit updated data and pages
        uses: stefanzweifel/git-auto-commit-action@v7
        id: commit
        with:
          skip_push: true
          commit_message: "Update COT data and charts"
          file_pattern: "*.csv *.html charts/*.html"

      - name: Publish after syncing concurrent data commits
        if: steps.commit.outputs.changes_detected == 'true'
        run: bash publish_data.sh
