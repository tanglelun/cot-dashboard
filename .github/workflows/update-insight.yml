name: Update Insight data

on:
  workflow_dispatch:
  schedule:
    # After the US close, then a second pass after provider delays.
    - cron: "45 22 * * 1-5"
    - cron: "45 4 * * 2-6"
    - cron: "26 * * * *"

permissions:
  contents: write

concurrency:
  group: update-insight-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check whether hourly recovery is needed
        id: freshness
        env:
          RECOVERY_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '26 * * * *' }}
        run: python check_update_needed.py insight
      - name: Refresh Insight independently of the full stock universe
        if: steps.freshness.outputs.needed == 'true'
        run: python -u update_market_pulse.py
      - if: steps.freshness.outputs.needed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        id: commit
        with:
          skip_push: true
          commit_message: "chore: refresh Insight data"
          file_pattern: "market_pulse_data.json market_pulse_view.json sp500_constituents.json"

      - name: Publish after syncing concurrent commits
        if: steps.commit.outputs.changes_detected == 'true'
        run: bash publish_data.sh

      - name: Preserve generated commit if publishing fails
        if: failure() && steps.commit.outputs.changes_detected == 'true'
        env:
          DATA_COMMIT: ${{ steps.commit.outputs.commit_hash }}
        run: git bundle create data-update.bundle "$DATA_COMMIT^..$DATA_COMMIT"
      - name: Upload recoverable data commit
        if: failure() && steps.commit.outputs.changes_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-update-${{ github.run_id }}
          path: data-update.bundle
          retention-days: 7
