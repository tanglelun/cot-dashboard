name: Update CNN Fear and Greed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

# Both workflows write the Market Pulse JSON files. Serialize their checkouts.
concurrency:
  group: update-insight-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh CNN independently of stock downloads
        run: python -u update_market_pulse.py --cnn-only
      - uses: stefanzweifel/git-auto-commit-action@v7
        id: commit
        with:
          skip_push: true
          commit_message: "chore: refresh CNN Fear and Greed"
          file_pattern: "market_pulse_data.json market_pulse_view.json"

      - name: Publish after syncing concurrent commits
        if: steps.commit.outputs.changes_detected == 'true'
        run: bash publish_data.sh

      - name: Preserve generated commit if publishing fails
        if: failure() && steps.commit.outputs.changes_detected == 'true'
        env:
          DATA_COMMIT: ${{ steps.commit.outputs.commit_hash }}
        run: git bundle create data-update.bundle "$DATA_COMMIT^..$DATA_COMMIT"
      - name: Upload recoverable data commit
        if: failure() && steps.commit.outputs.changes_detected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-update-${{ github.run_id }}
          path: data-update.bundle
          retention-days: 7
